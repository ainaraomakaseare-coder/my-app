<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>たびログ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c25a2e'/%3E%3Ctext x='16' y='23' font-size='17' text-anchor='middle' fill='white'%3E旅%3C/text%3E%3C/svg%3E">
<!-- Worker公開後に、そのURLをcontentへ設定する。空のままだとサーバーに保存できず案内だけが出る。 -->
<meta name="tabilog-api-endpoint" content="https://tabilog-api.hiroya-apps.workers.dev">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <!-- ============ 旅行一覧 ============ -->
  <section class="screen active" data-screen="home">
    <div class="wrap">
      <header class="hd">
        <h1>たびログ</h1>
        <p class="lead">家族と過ごした、あの旅の記録。</p>
      </header>

      <p class="notice" id="apiNotice" hidden></p>

      <div id="tripList" class="trip-list"></div>

      <div class="home-actions">
        <button class="btn primary" id="btnNewTrip">＋ 新しい旅を記録する</button>
      </div>

      <div class="field open-link">
        <label for="openTripId">招待リンクのIDを直接開く</label>
        <div class="row">
          <input type="text" id="openTripId" placeholder="trip_xxxxxxxx">
          <button class="btn ghost" id="btnOpenTripId">開く</button>
        </div>
      </div>

      <p class="hint">旅行はサーバー（データベース）に保存されます。共有リンクを知っている人は誰でも見たり書き足したりできます。</p>
    </div>
  </section>

  <!-- ============ 新しい旅を作る ============ -->
  <section class="screen" data-screen="newTrip">
    <div class="wrap narrow">
      <header class="hd">
        <button class="btn text back" data-back="home">← 戻る</button>
        <h1>新しい旅を記録する</h1>
      </header>

      <div class="field">
        <label for="ntTitle">旅のタイトル</label>
        <input type="text" id="ntTitle" placeholder="例：沖縄 家族旅行">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="ntStart">出発日</label>
          <input type="date" id="ntStart">
        </div>
        <div class="field">
          <label for="ntEnd">帰着日</label>
          <input type="date" id="ntEnd">
        </div>
      </div>
      <div class="field">
        <label for="ntCompanions">だれと行った？（読点区切り）</label>
        <input type="text" id="ntCompanions" placeholder="例：父、母、妹">
      </div>

      <p class="hint" id="newTripStatus"></p>
      <button class="btn primary wide" id="btnCreateTrip">この旅を作る</button>
    </div>
  </section>

  <!-- ============ 旅の詳細（日ごとのモデルコース） ============ -->
  <section class="screen" data-screen="tripDetail">
    <div class="wrap">
      <header class="trip-cover" id="tripCover">
        <button class="icon-btn back-btn" data-back="home" aria-label="戻る">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M12.5 4.5L7 10l5.5 5.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn share-btn" id="btnShareTrip" aria-label="共有">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="15.5" cy="4.5" r="2.3"/><circle cx="4.5" cy="10" r="2.3"/><circle cx="15.5" cy="15.5" r="2.3"/><path d="M6.5 8.8l7-3.3"/><path d="M6.5 11.2l7 3.3"/></svg>
        </button>
        <div class="trip-cover-text">
          <div class="trip-title" id="tripTitle"></div>
          <div class="trip-dates" id="tripDates"></div>
        </div>
      </header>

      <div class="companions-row">
        <div class="companions-names" id="tripCompanions"></div>
        <button class="chip-btn" id="btnInvite">
          <svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 5v10M5 10h10"/></svg>
          メンバーを招待
        </button>
      </div>

      <div class="stats-row" id="tripStats"></div>

      <div class="group-filter" id="groupFilter"></div>

      <div class="day-tabs" id="dayTabs"></div>

      <div class="section-label">
        <div class="section-title" id="dayTitle"></div>
        <div class="section-rule"></div>
        <div class="section-route" id="dayRouteText"></div>
      </div>

      <div class="route-strip" id="routeStrip"></div>

      <div class="timeline" id="timeline"></div>

      <p class="hint" id="tripDetailStatus"></p>
    </div>
  </section>

  <!-- ============ エピソードの追加・編集 ============ -->
  <section class="screen" data-screen="episodeForm">
    <div class="wrap narrow">
      <div class="sheet">
        <div class="sheet-grip"></div>
        <div class="sheet-head">
          <div class="sheet-title" id="epFormTitle">この時間の思い出を追加</div>
          <button class="icon-btn close-btn" data-back="tripDetail" aria-label="閉じる">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg>
          </button>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="epDate">日付</label>
            <input type="date" id="epDate">
          </div>
          <div class="field">
            <label for="epTime">時間</label>
            <input type="time" id="epTime">
          </div>
        </div>

        <div class="field">
          <label for="epPlace">場所</label>
          <input type="text" id="epPlace" placeholder="例：首里城公園">
        </div>

        <div class="field">
          <label>種類</label>
          <div class="cat-chips" id="epCategoryChips"></div>
        </div>

        <div class="field">
          <label for="epPhoto">写真</label>
          <input type="file" id="epPhoto" accept="image/*" multiple hidden>
          <div class="photo-picker" id="epPhotoPicker">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h1.3l.7-1.2c.2-.3.5-.5.9-.5h4.2c.4 0 .7.2.9.5l.7 1.2H15a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="10" cy="10.5" r="3.2"/></svg>
            <span>写真を追加する</span>
          </div>
          <div class="photo-preview" id="epPhotoPreview"></div>
        </div>

        <div class="field">
          <label for="epNote">ひとこと</label>
          <textarea id="epNote" rows="3" placeholder="どんな時間だった？"></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="epCost">費用（円）</label>
            <input type="number" id="epCost" min="0" step="1" placeholder="例：1200">
          </div>
          <div class="field">
            <label>楽しかった度</label>
            <div class="star-picker" id="epRatingPicker"></div>
          </div>
        </div>

        <div class="field">
          <label for="epGroupTag">別行動のチーム名（任意）</label>
          <input type="text" id="epGroupTag" placeholder="例：父・妹チーム（全員一緒なら空欄のまま）">
        </div>

        <div class="field">
          <label for="epMapUrl">地図のURL（任意）</label>
          <input type="url" id="epMapUrl" placeholder="https://maps.google.com/...">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="epInfoUrl">公式サイト・参考URL（任意）</label>
            <input type="url" id="epInfoUrl" placeholder="https://...">
          </div>
          <div class="field">
            <label for="epBookingSite">予約サイト名（任意）</label>
            <input type="text" id="epBookingSite" placeholder="例：じゃらん">
          </div>
        </div>

        <div class="field">
          <label for="epAuthor">記録した人（任意）</label>
          <input type="text" id="epAuthor" placeholder="例：わたし">
        </div>

        <p class="hint" id="epFormStatus"></p>
        <div class="sheet-actions">
          <button class="btn danger ghost" id="btnDeleteEpisode" hidden>この記録を削除</button>
          <button class="btn primary wide" id="btnSaveEpisode">この思い出を保存する</button>
        </div>
      </div>
    </div>
  </section>

</div>
<script src="app.js"></script>
</body>
</html>
