<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ドラマ検定</title>
<meta name="description" content="好きなドラマを入れると、その作品の問題が10問出ます。あなたのマニア度を測ります。">
<!-- Worker公開後に、そのURLをcontentへ設定する。空なら従来方式だけで動く。 -->
<meta name="drama-ai-endpoint" content="https://dramaou-ai.hiroya-apps.workers.dev">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#0C1017;
  --ink-hi:#151B26;
  --ink-sink:#070A0F;
  --line:#252E3E;
  --line-lit:#36425A;
  --paper:#ECE6DA;
  --paper-dim:#9AA0AC;
  --muted:#6E7789;
  --lamp:#E8B44C;
  --onair:#E0392C;
  --onair-lit:#FF5B4A;
  --cool:#6FA8B5;
  --good:#5FBE8A;
  --font-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ink);
  background-image:
    radial-gradient(ellipse 70% 45% at 50% -6%, rgba(232,180,76,.12), transparent 70%),
    radial-gradient(ellipse 55% 38% at 50% 106%, rgba(111,168,181,.06), transparent 70%);
  background-attachment:fixed;
  color:var(--paper);
  font-family:var(--font-body);
  line-height:1.65;
  -webkit-text-size-adjust:100%;
}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lamp);outline-offset:3px;border-radius:5px}
[hidden]{display:none !important}
.wrap{max-width:520px;margin:0 auto;padding:20px 18px 48px;display:flex;flex-direction:column;gap:20px;min-height:100dvh}

/* ---- 見出し ---- */
.masthead{display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);padding-bottom:12px}
.mast-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.logo{font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:.1em;margin:0}
.logo .on{color:var(--onair-lit)}
.tagline{font-size:12px;color:var(--muted);letter-spacing:.08em}

/* ---- 共通パーツ ---- */
.card{background:var(--ink-hi);border:1px solid var(--line);border-radius:12px;padding:16px}
.btn{
  display:block;width:100%;padding:13px 16px;border-radius:10px;font-size:15px;font-weight:700;
  letter-spacing:.06em;border:1px solid var(--line-lit);background:var(--ink-hi);color:var(--paper);
  transition:background .12s, border-color .12s;
}
.btn:hover:not(:disabled){background:#1D2534;border-color:var(--lamp)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--lamp);color:#1A1206;border-color:var(--lamp)}
.btn.primary:hover:not(:disabled){background:#F3C463;border-color:#F3C463}
.btn.ghost{background:none;font-weight:500;font-size:13px;padding:9px 14px;color:var(--paper-dim)}
.lead{font-size:14px;color:var(--paper-dim);margin:0}
.note{font-size:12px;color:var(--muted);line-height:1.7}
.err{color:var(--onair-lit);font-size:13px;line-height:1.7}

/* ---- 入口 ---- */
.search{display:flex;gap:8px}
.search input{
  flex:1;min-width:0;padding:13px 14px;border-radius:10px;background:var(--ink-sink);
  border:1px solid var(--line-lit);font-size:16px;
}
.search input::placeholder{color:var(--muted)}
.search button{flex:0 0 auto;padding:0 18px;border-radius:10px;border:1px solid var(--lamp);
  background:var(--lamp);color:#1A1206;font-weight:700;font-size:14px}
.search button:disabled{opacity:.4;cursor:default}
.examples{display:flex;flex-wrap:wrap;gap:6px}
.ex{background:none;border:1px solid var(--line);border-radius:99px;color:var(--paper-dim);
  font-size:12px;padding:5px 11px;line-height:1.5}
.ex:hover{border-color:var(--lamp);color:var(--paper)}

/* ---- 候補 ---- */
.hits{display:flex;flex-direction:column;gap:8px}
.hit{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:11px 12px;
  border-radius:10px;background:var(--ink-hi);border:1px solid var(--line);color:inherit}
.hit:hover{border-color:var(--lamp);background:#1D2534}
.hit img{flex:0 0 auto;width:44px;height:60px;object-fit:cover;border-radius:5px;background:var(--ink-sink)}
.hit .ph{flex:0 0 auto;width:44px;height:60px;border-radius:5px;background:var(--ink-sink);
  display:grid;place-items:center;color:var(--muted);font-size:19px}
.hit .t{font-weight:700;font-size:15px;line-height:1.45}
.hit .d{font-size:12px;color:var(--muted);line-height:1.5;margin-top:2px}

/* ---- 出題 ---- */
.progress{display:flex;gap:3px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.done{background:var(--lamp)}
.progress i.miss{background:var(--onair)}
.progress i.now{background:var(--paper-dim)}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);letter-spacing:.08em}
.lv{padding:3px 9px;border-radius:99px;border:1px solid var(--line);letter-spacing:.14em;font-size:11px}
.lv.l1{color:var(--cool);border-color:rgba(111,168,181,.45)}
.lv.l2{color:var(--lamp);border-color:rgba(232,180,76,.45)}
.lv.l3{color:var(--onair-lit);border-color:rgba(224,57,44,.5)}
.qtext{font-family:var(--font-display);font-weight:600;font-size:20px;line-height:1.6;
  letter-spacing:.02em;margin:0;text-wrap:pretty}
.choices{display:flex;flex-direction:column;gap:9px}
.ch{text-align:left;width:100%;padding:13px 15px;border-radius:10px;background:var(--ink-hi);
  border:1px solid var(--line);font-size:15px;line-height:1.5;transition:border-color .12s,background .12s}
.ch:hover:not(:disabled){border-color:var(--line-lit);background:#1D2534}
.ch:disabled{cursor:default}
.ch.right{border-color:var(--good);background:rgba(95,190,138,.13);color:#DFF3E8}
.ch.wrong{border-color:var(--onair);background:rgba(224,57,44,.13);color:#F6DAD6}
.ch .mk{font-weight:700;margin-right:9px;color:var(--muted)}
.ch.right .mk{color:var(--good)} .ch.wrong .mk{color:var(--onair-lit)}
.verdict{display:flex;flex-direction:column;gap:7px}
.verdict .v{font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:.06em}
.verdict .v.o{color:var(--good)} .verdict .v.x{color:var(--onair-lit)}

/* ---- 結果 ---- */
.scorebox{text-align:center;display:flex;flex-direction:column;gap:9px;padding:22px 16px}
.rank{font-family:var(--font-display);font-weight:800;font-size:35px;letter-spacing:.08em;
  line-height:1.25;color:var(--lamp)}
.pct{font-size:13px;color:var(--muted);letter-spacing:.1em;font-variant-numeric:tabular-nums}
.pct b{color:var(--paper);font-size:20px;font-weight:700}
.blurb{font-size:14px;color:var(--paper-dim);line-height:1.75;margin:0}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:78px 1fr 42px;align-items:center;gap:10px;font-size:12px}
.bar .nm{color:var(--paper-dim);letter-spacing:.06em}
.bar .tr{display:block;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
/* inline のままでは height が効かず、伸びない帯になる */
.bar .fl{display:block;height:100%;border-radius:4px;background:var(--lamp);
  transition:width .5s cubic-bezier(.2,.7,.3,1)}
.bar .vl{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:9px}
.rv{border-left:2px solid var(--line);padding:2px 0 2px 11px;font-size:13px;line-height:1.7}
.rv.o{border-color:var(--good)} .rv.x{border-color:var(--onair)}
.rv .q{color:var(--paper-dim)}
.rv .a{font-weight:700}
.rv.o .a{color:var(--good)} .rv.x .a{color:var(--onair-lit)}
.src{font-size:12px;color:var(--muted)}
.src a{color:var(--cool)}

/* ---- 読み込み ---- */
.loading{display:flex;flex-direction:column;gap:12px;align-items:center;padding:26px 12px;text-align:center}
.spin{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);
  border-top-color:var(--lamp);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.found{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.tag{font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.has{color:var(--lamp);border-color:rgba(232,180,76,.4)}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

/* Slackを思わせるワークスペースUI。ブランドを複製せず、情報階層を参考にする。 */
:root{
  --ink:#F8F8FA;--ink-hi:#FFF;--ink-sink:#F4F4F6;--line:#E3E3E7;--line-lit:#C8C7CC;
  --paper:#1D1C1D;--paper-dim:#454245;--muted:#6F6B6F;--lamp:#611F69;
  --onair:#E01E5A;--onair-lit:#E01E5A;--cool:#1264A3;--good:#007A5A;
  --font-display:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif
}
body{min-height:100dvh;background:#F8F8FA;background-image:none;color:var(--paper);line-height:1.55}
body::before{content:"ドラマ王　　⌕  クイズを検索";position:fixed;z-index:15;left:260px;right:0;top:0;height:52px;display:flex;align-items:center;justify-content:center;background:#4A154B;color:#F7EEF7;box-shadow:0 1px rgba(0,0,0,.18);font-size:13px;font-weight:700}
.wrap{max-width:none;margin:0;min-height:100dvh;padding:88px 56px 64px 316px;display:flex;align-items:center;gap:22px}
.wrap>section{width:min(760px,100%)}
.masthead{position:fixed;z-index:20;inset:0 auto 0 0;width:260px;padding:24px 18px;background:#3F0E40;border:0;color:#fff;box-shadow:inset -1px 0 rgba(0,0,0,.2);gap:16px}
.masthead::before{content:"DR";display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:#36C5F0;color:#3F0E40;font-size:15px;font-weight:900;box-shadow:inset 0 0 0 3px rgba(255,255,255,.32)}
.masthead::after{content:"チャンネル\A\A  #  クイズを探す\A  #  17作品の問題集\A  #  今日のスコア\A\Aダイレクトメッセージ\A\A  ●  クイズマスター";white-space:pre;display:block;padding:10px 8px;color:rgba(255,255,255,.74);font-size:13px;line-height:2.1;border-top:1px solid rgba(255,255,255,.16)}
.mast-top{align-items:center;justify-content:flex-start}.logo{font-family:var(--font-body);font-size:20px;letter-spacing:0;font-weight:800}.logo .on{color:#2EB67D;font-size:14px;margin-left:5px}.tagline{margin:0;color:rgba(255,255,255,.68);font-size:12px;line-height:1.6;letter-spacing:0}
#restart{position:absolute;left:18px;right:18px;bottom:22px;width:auto!important;color:#fff;border-color:rgba(255,255,255,.26);background:rgba(255,255,255,.08)}
.card{background:#fff;border:1px solid #E3E3E7;border-radius:14px;padding:24px;box-shadow:0 1px 1px rgba(29,28,29,.04),0 8px 28px rgba(29,28,29,.08)}
#scr-home{gap:18px!important}#scr-home::before{content:"クイズを始める";display:block;font-size:24px;line-height:1.25;font-weight:800;letter-spacing:-.02em}
.lead{font-size:15px;color:#454245}.note{font-size:12px;color:#6F6B6F}.err{color:#C00F47}
.search{gap:10px}.search input{min-height:48px;padding:12px 15px;background:#fff;border:1px solid #868486;color:#1D1C1D;border-radius:8px;box-shadow:inset 0 1px 2px rgba(0,0,0,.05)}
.search input:focus{border-color:#1264A3;box-shadow:0 0 0 3px rgba(18,100,163,.18);outline:0}.search input::placeholder{color:#868486}
.search button,.btn.primary{background:#611F69;border-color:#611F69;color:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.12);letter-spacing:0}.search button:hover:not(:disabled),.btn.primary:hover:not(:disabled){background:#4A154B;border-color:#4A154B}
.examples{gap:8px;padding-top:2px}.ex{background:#F8F8FA;border:1px solid #D8D7DA;color:#454245;border-radius:8px;font-size:12px;font-weight:600;padding:7px 11px;transition:.14s}.ex::before{content:"#";color:#868486;margin-right:5px}.ex:hover{background:#F2EAF3;border-color:#A86BB0;color:#4A154B;transform:translateY(-1px)}
.btn{background:#fff;color:#1D1C1D;border-color:#C8C7CC;border-radius:8px;letter-spacing:0}.btn:hover:not(:disabled){background:#F8F8FA;border-color:#868486}.btn.ghost{color:#454245}
.hit{background:#fff;border-color:#E3E3E7;border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(29,28,29,.05)}.hit:hover{background:#F8F8FA;border-color:#A86BB0}.hit img,.hit .ph{border-radius:8px;background:#F1EEF1}.hit .d{color:#6F6B6F}
#scr-quiz{background:#fff;border:1px solid #E3E3E7;border-radius:14px;padding:26px;box-shadow:0 1px 1px rgba(29,28,29,.04),0 8px 28px rgba(29,28,29,.08)}
.progress{gap:5px}.progress i{height:5px;background:#E8E8EB}.progress i.done{background:#611F69}.progress i.miss{background:#E01E5A}.progress i.now{background:#36C5F0}
.qhead{color:#6F6B6F;letter-spacing:0}.lv{border-color:#D8D7DA;background:#F8F8FA;letter-spacing:.04em;font-weight:700}.lv.l1{color:#007A5A;border-color:#9DD8C8}.lv.l2{color:#9B5D00;border-color:#EBC98B}.lv.l3{color:#C00F47;border-color:#F2A8C2}
.qtext{font-family:var(--font-body);font-size:22px;line-height:1.5;letter-spacing:-.01em;color:#1D1C1D}.choices{gap:10px}
.ch{padding:14px 16px;background:#fff;border:1px solid #C8C7CC;border-radius:9px;color:#1D1C1D;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:.14s}.ch:hover:not(:disabled){background:#F8F4F8;border-color:#611F69;transform:translateX(3px)}
.ch .mk{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:6px;background:#F1EEF1;color:#611F69;margin-right:10px}.ch.right{border-color:#007A5A;background:#ECF8F4;color:#0B4C3A}.ch.wrong{border-color:#E01E5A;background:#FFF0F5;color:#7A1236}
.verdict{box-shadow:none;border-left:4px solid #611F69}.verdict .v{font-family:var(--font-body)}
.scorebox{background:#4A154B;color:#fff;border:0;box-shadow:0 10px 30px rgba(74,21,75,.2)}.rank{font-family:var(--font-body);color:#fff;font-size:34px;letter-spacing:0}.pct{color:rgba(255,255,255,.72)}.pct b{color:#fff}.blurb{color:rgba(255,255,255,.82)}
.bar .nm{color:#454245}.bar .tr{background:#ECEAEC}.bar .fl{background:#611F69}.bar .vl{color:#6F6B6F}.rv{border-color:#D8D7DA}.rv .q{color:#454245}.src{color:#6F6B6F}.src a{color:#1264A3}
.spin{border-color:#E3E3E7;border-top-color:#611F69}.tag{border-color:#D8D7DA;color:#6F6B6F}.tag.has{color:#007A5A;border-color:#82CCB8;background:#ECF8F4}
@media(max-width:780px){body::before{display:none}.wrap{padding:0 14px 40px;gap:16px;align-items:stretch}.wrap>section{width:100%}.masthead{position:relative;inset:auto;width:calc(100% + 28px);margin:0 -14px;padding:15px 18px;background:#4A154B;min-height:116px;border-radius:0;box-shadow:0 2px 8px rgba(0,0,0,.16)}.masthead::before{position:absolute;right:18px;top:16px;width:36px;height:36px}.masthead::after{display:none}.tagline{max-width:74%}#restart{left:auto;right:18px;bottom:15px}.card,#scr-quiz{padding:19px;border-radius:12px}#scr-home::before{font-size:21px}.search{flex-direction:column}.search button{min-height:46px}.qtext{font-size:19px}.ch{padding:13px 12px}}
</style>
</head>
<body>
<div class="wrap">

<header class="masthead">
  <div class="mast-top">
    <h1 class="logo">ドラマ検定<span class="on">●</span></h1>
    <button class="btn ghost" id="restart" hidden style="width:auto">最初から</button>
  </div>
  <p class="tagline">好きなドラマの、どれだけ細部を覚えていますか</p>
</header>

<!-- 入口 -->
<section id="scr-home" class="card" style="display:flex;flex-direction:column;gap:14px">
  <p class="lead">作品名を入れると、日本語版 Wikipedia の記事から10問つくります。</p>
  <div class="search">
    <input id="q" type="search" placeholder="例：あまちゃん" autocomplete="off" enterkeyhint="search">
    <button id="go">検索</button>
  </div>
  <div class="examples" id="examples"></div>
  <p class="note">この17作品には、AIで作成して内容を確認した問題を20問ずつ用意してあります。</p>

  <p class="note" id="home-note" hidden></p>
</section>

<!-- 候補 -->
<section id="scr-hits" hidden style="display:flex;flex-direction:column;gap:12px">
  <p class="lead" id="hits-lead"></p>
  <div class="hits" id="hits"></div>
  <button class="btn ghost" id="back-home">検索しなおす</button>
</section>

<!-- 読み込み -->
<section id="scr-load" hidden>
  <div class="card loading">
    <div class="spin"></div>
    <p class="lead" id="load-msg">記事を読んでいます…</p>
    <div class="found" id="found"></div>
  </div>
</section>

<!-- 出題 -->
<section id="scr-quiz" hidden style="display:flex;flex-direction:column;gap:16px">
  <div class="progress" id="progress"></div>
  <div class="qhead">
    <span id="qcount"></span>
    <span class="lv" id="qlv"></span>
  </div>
  <p class="qtext" id="qtext"></p>
  <div class="choices" id="choices"></div>
  <div class="card verdict" id="verdict" hidden>
    <span class="v" id="vmark"></span>
    <span class="note" id="vnote"></span>
  </div>
  <button class="btn primary" id="next" hidden>次の問題</button>
</section>

<!-- 結果 -->
<section id="scr-done" hidden style="display:flex;flex-direction:column;gap:16px">
  <div class="card scorebox">
    <div class="rank" id="rank"></div>
    <div class="pct"><b id="score"></b> / <span id="full"></span> 点　正解 <span id="hits-n"></span>/10</div>
    <p class="blurb" id="blurb"></p>
  </div>
  <div class="card bars" id="bars"></div>
  <div class="card review" id="review"></div>
  <p class="src" id="src"></p>
  <button class="btn primary" id="again">同じドラマでもう一度</button>
  <button class="btn" id="other">別のドラマで挑む</button>
</section>

</div>
<script>
(function(){
"use strict";

/* ============================ PURE-BEGIN ============================
   この下の閉じ目印までは DOM にも通信にも触れない。
   test/quiz.test.js が この範囲を切り出して node 上で直接動かす。
   ==================================================================== */

/* 選択肢に出す主要局。ここに寄せられない局では、局を当てる問題を出さない */
var STATIONS = ["NHK","日本テレビ","TBS","フジテレビ","テレビ朝日","テレビ東京","WOWOW","Netflix"];

/* 表記ゆれを正式名に寄せる。長い綴りを先に置き、上から順に当てる。
   ここに無い綴りは空を返す。見知らぬ局を正解にしてしまわないため。   */
var STATION_ALIAS = [
  ["NHK総合","NHK"],["NHK BS","NHK"],["NHKBS","NHK"],["NHK教育","NHK"],["NHK Eテレ","NHK"],["NHK","NHK"],
  ["日本テレビ","日本テレビ"],["日テレ","日本テレビ"],
  ["TBSテレビ","TBS"],["東京放送","TBS"],["TBS","TBS"],
  ["フジテレビジョン","フジテレビ"],["フジテレビ","フジテレビ"],
  ["テレビ朝日","テレビ朝日"],["テレビ東京","テレビ東京"],
  ["毎日放送","毎日放送"],["MBS","毎日放送"],["朝日放送","朝日放送"],["ABCテレビ","朝日放送"],
  ["関西テレビ","関西テレビ"],["カンテレ","関西テレビ"],
  ["讀賣テレビ","読売テレビ"],["読売テレビ","読売テレビ"],
  ["テレビ大阪","テレビ大阪"],["東海テレビ","東海テレビ"],["中京テレビ","中京テレビ"],
  ["WOWOW","WOWOW"],["Netflix","Netflix"],["Amazon","Amazon Prime Video"],["Hulu","Hulu"],
  ["ABEMA","ABEMA"],["U-NEXT","U-NEXT"],["Disney","Disney+"]
];
function normStation(raw){
  var s = cleanText(raw);
  if(!s) return "";
  for(var i = 0; i < STATION_ALIAS.length; i++){
    if(s.indexOf(STATION_ALIAS[i][0]) >= 0) return STATION_ALIAS[i][1];
  }
  return "";
}

/* 記事には原作漫画やアニメ、海外リメイクの infobox も並ぶ。
   実写ドラマの箱を選び違えると、別作品の放送局や出演者を掴んでしまう。 */
var LIVE_KEYS  = ["出演者","演出","主演","プロデューサー","放送局","放送期間","放送時間"];
var ANIME_KEYS = ["アニメーション制作","シリーズ構成","キャラクターデザイン","声の出演","総作画監督","音響監督","作画監督","アニメーション"];
var BOOK_KEYS  = ["作者","掲載誌","出版社","巻数","レーベル","発表期間","判型","作画"];
var SCORE_KEYS = ["放送局","放送期間","放送時間","回数","話数","演出","出演者","脚本","主題歌","プロデューサー","制作","音楽","原作","ジャンル"];

function countKeys(box, keys){
  var c = 0;
  keys.forEach(function(k){ if(box[k] && cleanText(box[k])) c++; });
  return c;
}
function boxKind(box){
  var live = countKeys(box, LIVE_KEYS);
  var anime = countKeys(box, ANIME_KEYS);
  var book = countKeys(box, BOOK_KEYS);
  if(anime > 0 && anime >= live) return "anime";
  if(book > 0 && book >= live) return "book";
  return live > 0 ? "live" : "other";
}
/* 箱を1つだけ選ぶ。またいで値を拾うと、フジ版の出演者に韓国版の放送局が
   混ざるような取り違えが起きるので、混ぜないことを最優先にする。      */
function pickInfobox(boxes){
  if(!boxes || !boxes.length) return {};
  var live = boxes.filter(function(b){ return boxKind(b) === "live"; });
  var pool = live.length ? live : boxes;
  var best = pool[0], bestScore = -1;
  pool.forEach(function(b){
    var score = countKeys(b, SCORE_KEYS);
    /* 日本の局に寄せられる箱を優先する。海外版の箱を掴まないため */
    if(normStation(b["放送局"] || b["制作局"] || b["放送チャンネル"] || "")) score += 3;
    if(score > bestScore){ bestScore = score; best = b; }   /* 同点なら先に出てくる箱 */
  });
  return best;
}

/* ---- 乱数（種つき）。テストで結果を固定できるようにする ---- */
function rng(seed){
  var s = seed >>> 0 || 1;
  return function(){ s ^= s << 13; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
function pick(arr, rnd){ return arr[Math.floor(rnd() * arr.length)]; }
function shuffle(arr, rnd){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(rnd() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ---- 文字列の掃除 ---- */
/* 脚注 [1] や全角空白、改行を落として一行にする */
function cleanText(s){
  if(!s) return "";
  return String(s)
    .replace(/\[\s*(\d+|注\s*\d*|要出典|脚注\s*\d*)\s*\]/g, "")
    .replace(/[ 　]/g, " ")
    .replace(/\s*\n\s*/g, " ")
    .replace(/\s{2,}/g, " ")
    .trim();
}
/* infobox の一欄には複数人が入る。区切りで割って、肩書きや補足を落とす。
   <br> は読み取り側で改行にしてあるので、区切りとして先に割る。
   cleanText は改行を空白に潰すので、割ってから一つずつ通す。          */
function splitNames(s){
  if(!s) return [];
  return String(s)
    .split(/[、，,／/・･\n]/)
    .map(function(x){
      return cleanText(x)
        .replace(/[（(].*?[)）]/g, "")            /* （第1話）などの補足 */
        .replace(/^\s*[-–—‐]\s*/, "")
        .replace(/\s*(ほか|他|など)\s*$/, "")
        .trim();
    })
    .filter(function(x){ return x.length >= 2 && x.length <= 24; });
}

/* infobox の人物欄には「2013年版」「半沢直樹II」「エピソードゼロ」のような
   区切りの見出しが人名と同じ並びで入る。人名として扱えないものを落とす。  */
function looksLikeName(s){
  if(!s || s.length < 2 || s.length > 14) return false;
  if(/\d/.test(s)) return false;                                  /* 2013年版、第2期 */
  if(/[IVXivx]{2,}$/.test(s)) return false;                       /* 半沢直樹II */
  if(/(年版|年度|シーズン|シリーズ|エピソード|パート|続編|前編|後編|特別編|総集編|劇場版|スペシャル|ゼロ)/.test(s)) return false;
  if(/[「」『』（）()【】]/.test(s)) return false;
  if(/^(ほか|他|など|不明|未定|なし|同上)$/.test(s)) return false;
  return true;
}
/* 人物欄はこちらで読む。ジャンルや主題歌には使わない */
function personNames(s){
  var out = [], seen = {};
  splitNames(s).forEach(function(n){
    if(looksLikeName(n) && !seen[n]){ seen[n] = 1; out.push(n); }
  });
  return out;
}

/* ---- 数字の読み取り ---- */
function toHalf(s){
  return String(s).replace(/[０-９．]/g, function(c){
    return c === "．" ? "." : String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
  });
}
/* 「全11話」「11回」「11」から 11 を取る */
function readCount(s){
  var m = toHalf(cleanText(s)).match(/(\d{1,3})\s*(?:話|回|エピソード)?/);
  return m ? parseInt(m[1], 10) : null;
}
/* 「2016年10月11日 - 12月20日」から開始日を取る */
function readDate(s){
  var t = toHalf(cleanText(s));
  var m = t.match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
  if(m) return { y:+m[1], m:+m[2], d:+m[3] };
  m = t.match(/(\d{4})\s*年\s*(\d{1,2})\s*月/);
  if(m) return { y:+m[1], m:+m[2], d:null };
  m = t.match(/(\d{4})/);
  return m ? { y:+m[1], m:null, d:null } : null;
}
function dateLabel(o){
  if(!o) return "";
  if(o.m == null) return o.y + "年";
  if(o.d == null) return o.y + "年" + o.m + "月";
  return o.y + "年" + o.m + "月" + o.d + "日";
}
/* 「10.2%」「10.2％」から 10.2 を取る */
function readRating(s){
  var m = toHalf(cleanText(s)).match(/(\d{1,2}(?:\.\d)?)\s*[%％]/);
  return m ? parseFloat(m[1]) : null;
}

/* ---- infobox の生データを作品の形に整える ---- */
/* info は {ラベル: 生テキスト} の入れ物。表記ゆれを吸収してひとつに寄せる */
function fromInfobox(info){
  function get(){
    for(var i = 0; i < arguments.length; i++){
      var k = arguments[i];
      if(info[k] && cleanText(info[k])) return info[k];
    }
    return "";
  }
  var period = get("放送期間","放送期間・回数","放送日","公開期間","配信期間","放送");
  var start = readDate(period) || readDate(get("放送開始","初回放送"));
  /* 「TBS系列」「NHK総合テレビジョン」などの飾りごと名寄せする */
  var station = normStation(get("放送局","制作局","放送チャンネル","配信","ネットワーク"));
  return {
    station: station,
    start: start,
    count: readCount(get("回数","話数","各話数","全話数")),
    genre: splitNames(get("ジャンル","番組のジャンル")),
    writers: personNames(get("脚本","脚本家","原案・脚本")),
    directors: personNames(get("演出","監督","演出・監督")),
    cast: personNames(get("出演者","出演","主演")),
    composers: personNames(get("音楽","劇伴")),
    theme: splitNames(get("主題歌","オープニング","エンディング","テーマ曲")),
    origin: personNames(get("原作","原案")),
    producers: personNames(get("プロデューサー","制作","製作","チーフプロデューサー"))
  };
}

/* ---- 各話表を整える ---- */
/* rows は [{no,date,subtitle,rating}] の粗い配列。欠けは落とす */
function tidyEpisodes(rows){
  var out = [], seen = {};
  for(var i = 0; i < rows.length; i++){
    var r = rows[i];
    var no = r.no == null ? null : readCount(r.no);
    if(no == null || no < 1 || no > 200 || seen[no]) continue;
    seen[no] = 1;
    out.push({
      no: no,
      date: readDate(r.date),
      subtitle: cleanText(r.subtitle).replace(/^「(.*)」$/, "$1").replace(/^『(.*)』$/, "$1"),
      rating: readRating(r.rating)
    });
  }
  out.sort(function(a, b){ return a.no - b.no; });
  return out;
}

/* ---- 作品としてまとめる ---- */
function makeWork(title, url, info, epRows, chars, prose){
  var w = fromInfobox(info);
  w.title = title;
  w.url = url;
  /* 「半沢直樹II」のような続編の見出しが人物欄に並ぶことがある。
     ただし主人公の役名が作品名と同じ作品は多いので、
     作品名を含んで、なお長いものだけを落とす。                */
  var core = String(title).replace(/[（(].*?[)）]/g, "").trim();
  function isSeriesLabel(n){ return core.length >= 2 && n.length > core.length && n.indexOf(core) >= 0; }
  ["writers","directors","cast","composers","origin","producers"].forEach(function(k){
    w[k] = w[k].filter(function(n){ return !isSeriesLabel(n); });
  });
  w.episodes = tidyEpisodes(epRows || []);
  /* 役名と俳優の組。役名が作品名と紛れている行は落とす */
  w.characters = (chars || []).filter(function(c){
    return c && c.role && c.actor && c.role !== c.actor && !isSeriesLabel(c.role);
  });
  /* あらすじなどの地の文。表からは取れない「物語の中で何が起きたか」の材料 */
  w.prose = String(prose || "");
  w.aiQuestions = [];
  if(w.count == null && w.episodes.length >= 3) w.count = w.episodes.length;
  /* 年代の帯。ダミー人物を対象作から離すのに使う */
  var y = w.start ? w.start.y : null;
  w.era = y == null ? null : y < 2000 ? "1990" : y < 2010 ? "2000" : y < 2020 ? "2010" : "2020";
  return w;
}

/* 対象作と年代の離れた人物プールを返す */
function farActors(era){
  var keys = Object.keys(ACTORS);
  if(!era) return keys.reduce(function(a, k){ return a.concat(ACTORS[k]); }, []);
  var far = keys.filter(function(k){ return Math.abs(+k - +era) >= 20; });
  if(!far.length) far = keys.filter(function(k){ return k !== era; });
  return far.reduce(function(a, k){ return a.concat(ACTORS[k]); }, []);
}

/* 正解と重ならないダミーを n 個そろえる。足りなければ null */
function distract(pool, exclude, n, rnd){
  var bad = {};
  (exclude || []).forEach(function(x){ if(x) bad[String(x)] = 1; });
  var ok = pool.filter(function(x){ return x != null && !bad[String(x)]; });
  /* 重複を落とす */
  var uniq = [], seen = {};
  ok.forEach(function(x){ if(!seen[String(x)]){ seen[String(x)] = 1; uniq.push(x); } });
  if(uniq.length < n) return null;
  return shuffle(uniq, rnd).slice(0, n);
}

/* 正解1つとダミー3つを混ぜて四択にする */
function makeChoices(answer, wrongs, rnd){
  var all = shuffle([answer].concat(wrongs), rnd);
  return { choices: all.map(String), answer: all.indexOf(answer) };
}

/* 数値のダミー。正解の前後から散らす */
function numberWrongs(correct, spread, n, rnd, min){
  var cand = [];
  for(var d = 1; d <= spread; d++){
    if(min == null || correct - d >= min) cand.push(correct - d);
    cand.push(correct + d);
  }
  return distract(cand, [correct], n, rnd);
}

/* 記事の題名から作り置きを引く。記事の題名には
   「HERO (テレビドラマ)」のように括弧の但し書きが付くことがある。 */
function bakedKey(title){
  return String(title || "").replace(/[（(].*$/, "").replace(/[\s　]+/g, "").trim();
}
function bakedFor(title){
  var k = bakedKey(title);
  if(BAKED[k]) return BAKED[k];
  /* 「ドクターX 〜外科医・大門未知子〜」のように副題が続く題名もある */
  var keys = Object.keys(BAKED);
  for(var i = 0; i < keys.length; i++){
    var normalizedKey = bakedKey(keys[i]);
    if(normalizedKey.length >= 3 && k.indexOf(normalizedKey) === 0) return BAKED[keys[i]];
  }
  return null;
}

/* ---- 地の文を出題に使うための部品 ----
   表や箱書きからは「誰が何を演じたか」までしか問えない。
   物語の中で何が起きたかは、あらすじや人物の説明文にしか書いていない。 */

/* クイズに使える節だけ拾う。受賞や外部リンクは物語の材料にならない */
var PROSE_WANT = /あらすじ|概要|物語|ストーリー|登場人物|人物|キャスト|各話|エピソード/;
var PROSE_SKIP = /受賞|関連|外部リンク|脚注|出典|参考文献|放送局|ネット局|主題歌|商品|書誌|備考|スタッフ/;

/* 節の配列を、上限文字数まで詰める。節の途中では切らない。
   文の途中で切れた材料から作った設問は壊れるので、入り切らない節は丸ごと落とす。 */
function packProse(sections, limit){
  var want = [], rest = [];
  (sections || []).forEach(function(s){
    if(!s || !s.text) return;
    if(PROSE_SKIP.test(s.head || "")) return;
    (PROSE_WANT.test(s.head || "") ? want : rest).push(s);
  });
  var out = [], used = 0;
  want.concat(rest).forEach(function(s){
    var piece = (s.head ? "## " + s.head + "\n" : "") + s.text;
    if(used + piece.length > limit) return;
    out.push(piece); used += piece.length;
  });
  return out.join("\n\n");
}

/* 地の文を文に割る。短すぎる文は設問にならず、長すぎる文は読ませるのが苦しい */
function sentencesOf(text){
  var out = [];
  String(text || "").split("\n").forEach(function(line){
    if(/^##/.test(line)) return;                    /* packProse が付ける節見出し */
    line.split("。").forEach(function(t){
      t = cleanText(t);
      if(t.length >= 12 && t.length <= 64) out.push(t + "。");
    });
  });
  return out;
}

/* 役名の呼び名を並べる。記事は「天野アキ」を本文で「アキ」と書くので、
   フルネームだけで探すと地の文に一度も当たらない。
   ただし他の人物と紛れる呼び名は使わない。伏せたときに誰だか決まらなくなる。 */
function nameForms(role, all){
  var cand = [role];
  var sp = String(role).split(/[\s・=＝]/).filter(function(x){ return x.length >= 2; });
  if(sp.length > 1) cand = cand.concat(sp);
  else {
    if(role.length >= 4){ cand.push(role.slice(0, 2)); cand.push(role.slice(-2)); }
    if(role.length >= 5){ cand.push(role.slice(0, 3)); cand.push(role.slice(-3)); }
  }
  var uniq = [], seen = {};
  cand.forEach(function(c){
    if(!c || c.length < 2 || seen[c]) return;
    seen[c] = 1;
    /* その呼び名を含む役名が、対象の一人だけであること */
    if((all || []).filter(function(r){ return r.indexOf(c) >= 0; }).length === 1) uniq.push(c);
  });
  return uniq;
}

/* 文の中の呼び名を伏せる。同じ呼び名が何度出ても全部伏せないと答えが漏れる */
var BLANK = "〇〇〇";
function blankOut(sentence, forms){
  var out = String(sentence);
  /* 長い呼び名から先に伏せる。「アキ」を先に伏せると「天野アキ」が壊れる */
  (forms || []).slice().sort(function(a, b){ return b.length - a.length; })
    .forEach(function(f){ out = out.split(f).join(BLANK); });
  return out.replace(new RegExp("(" + BLANK + ")+", "g"), BLANK);
}

    return nameForms(c.role, roles).every(function(f){ return c.desc.indexOf(f) < 0; });
  });
  return shuffle(pool, rnd).slice(0, 3).map(function(c, i){
    var wrongs = distract(roles, [c.role], 3, rnd);
    if(!wrongs) return null;
    var ch = makeChoices(c.role, wrongs, rnd);
    return { text:"『" + w.title + "』で「" + c.desc + "」と説明されるのは？",
             choices:ch.choices, answer:ch.answer, level:i === 0 ? 2 : 3,
             why:c.role + "（演 " + c.actor + "）の説明。" };
  }).filter(Boolean);
}},

/* 人物どうしの関係を問う。「アキの母は誰か」は表には無い */
{ id:"relation", tier:"content", group:"story", make:function(w, rnd){
  if(w.characters.length < 4) return [];
  var roles = w.characters.map(function(c){ return c.role; });
  var made = [];
  shuffle(w.characters, rnd).forEach(function(c){
    if(made.length >= 2 || !c.desc) return;
    var m = c.desc.match(REL);
    if(!m) return;
    /* 「◯◯の母」の◯◯が、この作品の別の人物として実在すること */
    var who = null;
    roles.forEach(function(r){
      if(r === c.role) return;
      if(r === m[1] || nameForms(r, roles).indexOf(m[1]) >= 0) who = r;
    });
    if(!who) return;
    var wrongs = distract(roles, [c.role, who], 3, rnd);
    if(!wrongs) return;
    var ch = makeChoices(c.role, wrongs, rnd);
    made.push({ text:"『" + w.title + "』で " + who + " の" + m[2] + "にあたるのは？",
                choices:ch.choices, answer:ch.answer, level:made.length === 0 ? 2 : 3,
                why:c.role + "（演 " + c.actor + "）が " + who + " の" + m[2] + "。" });
  });
  return made;
}},

/* あらすじの一節を伏せて当てさせる。どれも記事に書いてある本物の文なので、
   うろ覚えでは引っかかる。観ていないと埋まらない。 */
{ id:"cloze", tier:"content", group:"plot", make:function(w, rnd){
  var roles = w.characters.map(function(c){ return c.role; });
  if(roles.length < 4) return [];
  var forms = {};
  roles.forEach(function(r){ forms[r] = nameForms(r, roles); });
  var made = [];
  shuffle(sentencesOf(w.prose), rnd).forEach(function(sn){
    if(made.length >= 3) return;
    /* 文に出てくる人物がちょうど一人のときだけ使う。
       二人以上いると、伏せた先が一意に決まらない */
    var hit = roles.filter(function(r){
      return forms[r].some(function(f){ return sn.indexOf(f) >= 0; });
    });
    if(hit.length !== 1) return;
    var blanked = blankOut(sn, forms[hit[0]]);
    if(blanked.indexOf(BLANK) < 0) return;
    var wrongs = distract(roles, [hit[0]], 3, rnd);
    if(!wrongs) return;
    var ch = makeChoices(hit[0], wrongs, rnd);
    made.push({ text:"あらすじの一節です。" + BLANK + " に入るのは？「" + blanked + "」",
                choices:ch.choices, answer:ch.answer, level:made.length === 0 ? 2 : 3,
                why:"正しくは「" + sn + "」。" });
  });
  return made;
}},

{ id:"airdate", tier:"fact", make:function(w, rnd){

/* ---- 10問を組む ----
   まず中身の問題だけで 易3・中4・難3 を狙い、埋まらない層を
   中身の余りで、それでも足りなければ事実の問題で補う。      */
var WANT = { 1:3, 2:4, 3:3 };
/* 記事から拾う地の文の上限。長い記事で処理が重くならないようにするための枠 */
var PROSE_LIMIT = 20000;
var TOTAL = 10;

/* 同じテンプレから何問まで採るか。同じ言い回しが並ぶと問題数の水増しに見える */
var PER_TEMPLATE = 2;
/* 同じ材料の系統から何問まで採るか。役名も出演者も「人物の表」という同じ材料 */
var PER_GROUP = 4;
/* 手で確認した作り置き問題は、10問中の半分まで使う。
   残り半分は記事から作り、毎回の変化も残す。 */
var BAKED_PER_QUIZ = 5;

function buildQuiz(w, seed){
  var rnd = rng(seed || 1);
  var content = [], fact = [], spareC = [], spareF = [], baked = [], perGroup = {};
  /* 別のテンプレが同じ問題文を作ることがある（sub_first の第1話と、
     sub_mid が引いた第1話など）。同じ問いが二度出ると水増しに見えるので、
     採る時点で落とす。先に採ったほうを残す。 */
  var seenText = {};
  shuffle(TEMPLATES, rnd).forEach(function(t){
    var made = t.make(w, rnd) || [];
    if(!made.length) return;
    made.forEach(function(q, i){
      q.id = t.id + (made.length > 1 ? "#" + (i + 1) : "");
      q.tier = t.tier;
    });
    /* テンプレの取りこぼしはここで止める。落ちた設問は捨てる */
    made = made.filter(function(q){
      if(checkMade(q, w).length) return false;
      if(seenText[q.text]) return false;
      seenText[q.text] = 1;
      return true;
    });
    if(!made.length) return;
    /* まずは同じ言い回し・同じ材料が並ばない範囲だけ採る */
    var g = t.group || t.id;
    var room = PER_GROUP - (perGroup[g] || 0);
    /* 作り置きだけは通常テンプレの2問制限とは別枠で最大5問採る */
    var take = t.id === "baked"
      ? Math.min(BAKED_PER_QUIZ, made.length)
      : Math.min(PER_TEMPLATE, room, made.length);
    if(take < 0) take = 0;
    perGroup[g] = (perGroup[g] || 0) + take;
    /* 作り置きは手で作った、記事からは作れない問題。テンプレ同士の
       取り合いに負けて出ないのでは置いた意味がないので、別に取っておく。 */
    var pool = t.id === "baked" ? baked : (t.tier === "content" ? content : fact);
    made.slice(0, take).forEach(function(q){ pool.push(q); });
    /* 溢れたぶんは控えに回す。材料の薄い作品では、繰り返してでも数を揃えるほうがいい */
    /* 作り置きの6問目以降を控えへ回すと、後段で上限を超えてしまうので採用しない */
    if(t.id !== "baked"){
      made.slice(take).forEach(function(q){ (t.tier === "content" ? spareC : spareF).push(q); });
    }
  });

  function take(pool, lv, n){
    var out = [];
    for(var i = 0; i < pool.length && out.length < n; i++){
      if(pool[i].level === lv) out.push(pool.splice(i--, 1)[0]);
    }
    return out;
  }
  var quiz = [];
  [1, 2, 3].forEach(function(lv){
    /* 中身の問題で埋まらない層は、外側の事実より先に「中身の控え」で埋める。
       控えは同じ言い回しが重なるが、それでも事実問題より中身のほうが面白い。 */
    var got = take(baked, lv, WANT[lv]);
    if(got.length < WANT[lv]) got = got.concat(take(content, lv, WANT[lv] - got.length));
    if(got.length < WANT[lv]) got = got.concat(take(spareC, lv, WANT[lv] - got.length));
    if(got.length < WANT[lv]) got = got.concat(take(fact, lv, WANT[lv] - got.length));
    quiz = quiz.concat(got);
  });
  /* 層が埋まらなかったぶんを足して数を合わせる。優先順は
     中身 → 中身の控え → 外側の事実 → 事実の控え。
     控えは同じ言い回しが重なるので最後だが、問題が少ないほうが困る。
     材料の足りている作品では控えまで手が伸びない。 */
  var rest = shuffle(baked, rnd)
    .concat(shuffle(content, rnd))
    .concat(shuffle(spareC, rnd))
    .concat(shuffle(fact, rnd))
    .concat(shuffle(spareF, rnd));
  while(quiz.length < TOTAL && rest.length) quiz.push(rest.shift());
  quiz.sort(function(a, b){ return a.level - b.level; });
  return quiz.slice(0, TOTAL);
}

/* AIが10問すべてを検査に通せた場合は、その10問だけを使う。
   AI問題と従来テンプレを混ぜると、品質を上げる目的なのに視聴率や
   サブタイトル暗記が残るため。1問でも壊れていれば従来方式へ戻す。 */
function buildAiQuiz(w, seed){
  var rnd = rng(seed || 1);
  var made = (w.aiQuestions || []).map(function(b, i){
    var c = makeChoices(b[1], b[2].slice(), rnd);
    return { id:"ai#" + (i + 1), tier:"content", text:b[0], choices:c.choices,
             answer:c.answer, level:b[3], why:b[4] };
  }).filter(function(q){ return checkMade(q, w).length === 0; });
  if(made.length < TOTAL) return [];
  return shuffle(made, rnd).slice(0, TOTAL).sort(function(a, b){ return a.level - b.level; });
}

function quizForWork(w, seed){
  var ai = buildAiQuiz(w, seed);
  return ai.length === TOTAL ? ai : buildQuiz(w, seed);
}

/* ---- 採点 ---- */
/* 難しい問題ほど重い。満点は実際に出した問題の重みの合計 */
function grade(quiz, answers){
  var got = 0, full = 0, hits = 0;
  var per = { 1:{ got:0, full:0 }, 2:{ got:0, full:0 }, 3:{ got:0, full:0 } };
  quiz.forEach(function(q, i){
    var w = q.level;
    full += w; per[q.level].full += w;
    if(answers[i] === q.answer){ got += w; hits++; per[q.level].got += w; }
  });
  return { score:got, full:full, hits:hits, ratio:full ? got / full : 0, per:per };
}

var RANKS = [
  { at:1.00, name:"制作陣",     blurb:"全問正解。もうあなたが次の話を書いてください。" },
  { at:0.85, name:"ガチ勢",     blurb:"各話のサブタイトルまで身体に入っている。相当です。" },
  { at:0.70, name:"リアタイ勢", blurb:"毎週きちんと追っていた人の点数。制作陣まで見えています。" },
  { at:0.50, name:"見てた人",   blurb:"筋はちゃんと覚えている。細部はもう一周すると化けます。" },
  { at:0.30, name:"うろ覚え",   blurb:"話題になっていたのは知っている、くらいの手ざわり。" },
  { at:0.00, name:"にわか",     blurb:"ここからです。まず初回だけでも観直してみませんか。" }
];
function rankOf(ratio){
  for(var i = 0; i < RANKS.length; i++) if(ratio >= RANKS[i].at) return RANKS[i];
  return RANKS[RANKS.length - 1];
}


/* ================= 出題の検査 =================
   .claude/skills/quiz-design の「出題を出す前の4つの検査」をコードにしたもの。
   テンプレの取りこぼしは必ず出るので、組み上げた設問は全部ここを通す。
   落ちた設問は直さずに捨てる。数は他のテンプレで埋まる。 */

/* 壊れている理由の配列を返す。空なら合格。answer は choices の添字。 */
function checkMade(q, work){
  var bad = [];
  if(!q || typeof q !== "object") return ["設問の形が違う"];
  if(typeof q.text !== "string" || q.text.trim().length < 6) bad.push("問題文が短すぎる");
  if(!Array.isArray(q.choices)) return bad.concat("choices が配列でない");
  if(q.choices.length !== 4) bad.push("選択肢が4つでない");
  if(q.choices.some(function(c){ return typeof c !== "string" || !c.trim(); })) bad.push("空の選択肢がある");

  var seen = {}, dup = false;
  q.choices.forEach(function(c){ if(seen[c]) dup = true; seen[c] = 1; });
  if(dup) bad.push("選択肢が重複している");

  var ans = q.choices[q.answer];
  if(typeof q.answer !== "number" || ans == null) bad.push("answer が選択肢を指していない");

  /* 答えが問題文に漏れていないか。1文字の一致は偶然が多いので2文字から見る */
  if(typeof ans === "string" && ans.length >= 2 &&
     typeof q.text === "string" && q.text.indexOf(ans) >= 0) bad.push("問題文に答えが含まれている");

  /* 正解だけ長さが浮いていないか。
     比率だけで見ると「海女」対「喫茶店の店主」のような、日本語では普通の
     組み合わせまで落ちてしまう。字数の差も一緒に見て、両方あてはまる時だけ弾く。 */
  if(typeof ans === "string"){
    var others = q.choices.filter(function(c, i){ return i !== q.answer; });
    if(others.length){
      var avg = others.reduce(function(a, c){ return a + c.length; }, 0) / others.length;
      var ratio = ans.length > avg * 1.8 || ans.length * 1.8 < avg;
      if(avg > 0 && ratio && Math.abs(ans.length - avg) >= 4) bad.push("正解だけ長さが浮いている");
    }
  }

  if([1, 2, 3].indexOf(q.level) < 0) bad.push("level が 1〜3 でない");
  /* 作品名そのものが答えになる設問は、題名を入れた時点で解けている */
  if(work && work.title && ans === work.title) bad.push("作品名そのものが答えになっている");

  return bad;
}

/* 難しさの呼び名。level は 1=易 2=中 3=難 なので、中身ではなく難しさで呼ぶ。
   テンプレ出題とAI出題が混ざると、中身での呼び分けは嘘になる。 */
var LEVEL_NAME = { 1:"やさしい", 2:"ふつう", 3:"難しい" };

/* ============================= PURE-END ============================= */

/* ---- 取得（ここから先は通信と DOM） ---- */
var API = "https://ja.wikipedia.org/w/api.php";
function api(params){
  var u = new URL(API);
  params.format = "json";
  params.origin = "*";          /* CORS を許すための Wikipedia の作法 */
  params.formatversion = "2";
  Object.keys(params).forEach(function(k){ u.searchParams.set(k, params[k]); });
  return fetch(u, { redirect:"follow" }).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}

/* 作品名で候補を引く。説明文でドラマらしいものを上に寄せる */
function search(q){
  return api({
    action:"query", generator:"search", gsrsearch:q, gsrlimit:"14",
    prop:"pageimages|description", piprop:"thumbnail", pithumbsize:"120"
  }).then(function(j){
    var pages = (j.query && j.query.pages) || [];
    var hits = pages.map(function(p){
      return { title:p.title, desc:p.description || "", thumb:p.thumbnail && p.thumbnail.source,
               index:p.index || 99 };
    });
    function looksDrama(h){
      return /ドラマ|テレビ番組|連続テレビ小説|大河ドラマ|テレビシリーズ|TVシリーズ/i.test(h.desc + " " + h.title);
    }
    hits.sort(function(a, b){
      var d = (looksDrama(b) ? 1 : 0) - (looksDrama(a) ? 1 : 0);
      return d !== 0 ? d : a.index - b.index;
    });
    return hits;
  });
}

/* 記事の本文 HTML を取る。infobox と各話表がここに全部入っている */
function fetchArticle(title){
  return api({ action:"parse", page:title, prop:"text", redirects:"1" }).then(function(j){
    if(j.error) throw new Error(j.error.info || "記事を読めません");
    return { title:j.parse.title, html:j.parse.text };
  });
}

/* ---- HTML から材料を抜く ---- */
/* infobox の各行を {ラベル:テキスト} に。表記ゆれは fromInfobox が吸収する */
function readInfobox(root){
  var out = [];
  var boxes = root.querySelectorAll("table.infobox, table.infobox_v2, table.infobox_v3");
  for(var b = 0; b < boxes.length; b++){
    var info = {};
    var rows = boxes[b].querySelectorAll("tr");
    for(var i = 0; i < rows.length; i++){
      var th = rows[i].querySelector("th"), td = rows[i].querySelector("td");
      if(!th || !td) continue;
      var key = cleanText(th.textContent);
      if(!key || info[key]) continue;
      /* <br> と <li> を区切りとして残したいので、いったん改行に置き換える */
      var clone = td.cloneNode(true);
      clone.querySelectorAll("br").forEach(function(el){ el.replaceWith("\n"); });
      clone.querySelectorAll("li").forEach(function(el){ el.append("\n"); });
      clone.querySelectorAll("sup, style, .reference").forEach(function(el){ el.remove(); });
      info[key] = clone.textContent;
    }
    out.push(info);
  }
  return out;
}

/* rowspan / colspan のある表を、行×列の升目に展開する。
   演出や脚本が複数話にまたがる表では、素直に td を数えると列がずれ、
   サブタイトルのつもりで演出や視聴率を読んでしまう。            */
function tableGrid(table){
  var grid = [], rows = table.rows;
  for(var r = 0; r < rows.length; r++){
    if(!grid[r]) grid[r] = [];
    var cells = rows[r].cells, c = 0;
    for(var i = 0; i < cells.length; i++){
      while(grid[r][c] !== undefined) c++;         /* 上から伸びてきた升を avoid */
      var cell = cells[i];
      var rs = Math.max(1, parseInt(cell.getAttribute("rowspan") || "1", 10) || 1);
      var cs = Math.max(1, parseInt(cell.getAttribute("colspan") || "1", 10) || 1);
      var text = cleanText(cell.textContent);
      for(var dr = 0; dr < rs; dr++){
        for(var dc = 0; dc < cs; dc++){
          if(!grid[r + dr]) grid[r + dr] = [];
          grid[r + dr][c + dc] = text;
        }
      }
      c += cs;
    }
  }
  return grid;
}

/* 見出しの行から、どの列が何かを当てる */
function matchColumns(head){
  var col = { no:-1, date:-1, subtitle:-1, rating:-1 };
  for(var h = 0; h < head.length; h++){
    var label = cleanText(head[h] || "");
    if(col.no < 0 && /^(話数?|各話|回|話|放送回|回数)$/.test(label)) col.no = h;
    else if(col.date < 0 && /放送日|配信日|放送年月日|日付/.test(label)) col.date = h;
    else if(col.subtitle < 0 && /サブタイトル|副題|話タイトル|各話タイトル|題名|^タイトル$/.test(label)) col.subtitle = h;
    else if(col.rating < 0 && /視聴率/.test(label)) col.rating = h;
  }
  return col;
}

/* 表ひとつから各話を読む。見出しは先頭3行のどれかにある */
function readEpisodeTable(table){
  var grid = tableGrid(table);
  if(grid.length < 3) return [];
  for(var h = 0; h < Math.min(3, grid.length); h++){
    var col = matchColumns(grid[h]);
    if(col.no < 0 || (col.subtitle < 0 && col.rating < 0)) continue;
    var got = [];
    for(var r = h + 1; r < grid.length; r++){
      var row = grid[r] || [];
      function at(i){ return i >= 0 && row[i] != null ? row[i] : ""; }
      got.push({ no:at(col.no), date:at(col.date), subtitle:at(col.subtitle), rating:at(col.rating) });
    }
    /* サブタイトルのつもりの列に数字ばかり並ぶなら、掴み違えているので捨てる */
    if(col.subtitle >= 0){
      var vals = got.map(function(g){ return g.subtitle; }).filter(function(v){ return v; });
      var numeric = vals.filter(function(v){ return /^[\d.,%％\s-]+$/.test(toHalf(v)); }).length;
      if(vals.length && numeric * 2 > vals.length){
        got.forEach(function(g){ g.subtitle = ""; });
      }
    }
    return got;
  }
  return [];
}

/* 記事の中の各話表を探す */
function readEpisodes(root, expect){
  var tables = root.querySelectorAll("table.wikitable");
  var found = [];
  for(var t = 0; t < tables.length; t++){
    var got = readEpisodeTable(tables[t]);
    if(got.length) found.push(got);
  }
  if(!found.length) return [];
  /* 話数が分かっているなら、行数がそれに一番近い表を採る。
     アニメ版や海外版の話数表を掴まないための決め手になる。   */
  if(expect){
    return found.reduce(function(a, b){
      return Math.abs(b.length - expect) < Math.abs(a.length - expect) ? b : a;
    });
  }
  var big = found.filter(function(g){ return g.length >= 4; });
  return big.length ? big[0] : found[0];
}

/* 登場人物の節から「役名」と「演じた俳優」の組を拾う。
   ja.wikipedia では
       ; 役名（よみ）
       : 演 - 俳優名
   という書き方が最も広く、「演 -」が役と俳優を結ぶ確かな目印になる。
   箇条書きしか無い記事のために、infobox の出演者を手がかりに
   「役名 - 俳優名」のどちら側が俳優かを決める道も用意する。      */
function readCharacters(root, castHint){
  var pairs = [], seen = {};
  function add(role, actor, desc){
    role = cleanText(role).replace(/[（(].*?[)）]/g, "").replace(/[「」『』]/g, "").trim();
    actor = personNames(actor)[0] || "";
    if(!role || !actor || role === actor) return;
    if(role.length < 2 || role.length > 20 || /\d/.test(role)) return;
    if(seen[role] || seen[actor]) return;          /* 一人二役は選択肢が濁るので採らない */
    seen[role] = seen[actor] = 1;
    /* 説明文は出題の材料になる。「アキの母。」の一行が、そのまま関係を問う設問になる */
    pairs.push({ role:role, actor:actor, desc:cleanText(desc || "") });
  }
  var ACT = /^演\s*[-‐−–—―:：]\s*(.+)$/;
  var dts = root.querySelectorAll("dt");
  for(var i = 0; i < dts.length; i++){
    var n = dts[i].nextElementSibling, hit = null, desc = [];
    while(n && n.tagName === "DD"){
      var line = cleanText(n.textContent);
      var m = line.match(ACT);
      if(m && !hit) hit = m[1];
      else if(hit) desc.push(line);          /* 演者の行より後ろが人物の説明 */
      n = n.nextElementSibling;
    }
    if(hit) add(dts[i].textContent, hit, desc.join(" "));
  }
  if(pairs.length >= 4) return pairs;

  var hint = {};
  (castHint || []).forEach(function(a){ hint[a] = 1; });
  var lis = root.querySelectorAll("li");
  for(var j = 0; j < lis.length; j++){
    var t = cleanText(lis[j].textContent);
    var m2 = t.match(/^(.{2,20}?)\s*[-‐−–—―]\s*(.{2,20}?)(?:[（(]|$)/);
    if(!m2) continue;
    if(hint[m2[2]]) add(m2[1], m2[2]);
    else if(hint[m2[1]]) add(m2[2], m2[1]);
  }
  return pairs;
}

function parseArticle(title, html){
  var doc = new DOMParser().parseFromString(html, "text/html");
  var url = "https://ja.wikipedia.org/wiki/" + encodeURIComponent(title.replace(/ /g, "_"));
  var info = pickInfobox(readInfobox(doc.body));
  var base = fromInfobox(info);
  return makeWork(title, url, info,
                  readEpisodes(doc.body, base.count),
                  readCharacters(doc.body, base.cast),
                  packProse(readProse(doc.body), PROSE_LIMIT));
}

/* ---- 記事の文章を節ごとに取る ----
   表や箱書きではなく、あらすじや人物の説明そのもの。AIに読ませる材料になる。 */
function readProse(root){
  var out = [], head = "", buf = [];
  function flush(){
    var t = buf.join("\n").trim();
    if(t) out.push({ head:head, text:t });
    buf = [];
  }
  var body = root.querySelector(".mw-parser-output") || root;
  /* 節見出しと段落を上から順に拾う。表・注釈・目次は材料にしない */
  /* dd を含めるのは、日本語版の登場人物節が dl/dt/dd で書かれているため。
     人物の説明はAIに読ませたい材料そのものなので、落とすと中身を問えなくなる。 */
  var nodes = body.querySelectorAll("h2, h3, p, li, dd");
  for(var i = 0; i < nodes.length; i++){
    var el = nodes[i];
    var tag = el.tagName.toLowerCase();
    if(el.closest("table, .navbox, .reflist, #toc, .mw-editsection")) continue;
    if(tag === "h2" || tag === "h3"){
      flush();
      head = cleanText(el.textContent).replace(/\[編集\]$/, "").trim();
      continue;
    }
    /* 脚注番号は材料としては雑音 */
    var clone = el.cloneNode(true);
    var sups = clone.querySelectorAll("sup");
    for(var s = 0; s < sups.length; s++) sups[s].remove();
    var t = cleanText(clone.textContent);
    if(t.length >= 12) buf.push(t);
  }
  flush();
  return out;
}

/* ---- 画面 ---- */
var $ = function(id){ return document.getElementById(id); };
var SCREENS = ["home","hits","load","quiz","done"];
function show(name){

/* 入口に出す作品名。作り置きのある作品をそのまま並べる。
   手で書き写すと必ずずれるので、作り置きの表から引く。 */
var EXAMPLES = Object.keys(BAKED);
var state = { work:null, quiz:null, at:0, answers:[], locked:false };

/* ---- 入口 ---- */
EXAMPLES.forEach(function(name){

});

function runSearch(){
  var q = $("q").value.trim();
  if(!q) return;
  $("go").disabled = true;
  $("home-note").textContent = ""; $("home-note").hidden = true;
  search(q).then(function(hits){
    if(!hits.length){
      $("home-note").innerHTML = '<span class="err">「' + esc(q) + '」で記事が見つかりませんでした。正式な題名で試してください。</span>';
      $("home-note").hidden = false;
      return;
    }
    showHits(q, hits);
  }).catch(function(e){
    $("home-note").innerHTML = '<span class="err">検索できませんでした（' + esc(e.message) + '）。'
      + 'この画面をローカルのファイルとして開いている場合、通信が遮られていることがあります。</span>';
    $("home-note").hidden = false;
  }).then(function(){ $("go").disabled = false; });
}
$("go").onclick = runSearch;
$("q").addEventListener("keydown", function(e){ if(e.key === "Enter") runSearch(); });

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); }

/* ---- 候補 ---- */
function showHits(q, hits){
  $("hits-lead").textContent = "「" + q + "」の候補です。挑む作品を選んでください。";
  var box = $("hits"); box.textContent = "";

    var img = h.thumb
      ? '<img src="' + esc(h.thumb) + '" alt="" loading="lazy">'
      : '<span class="ph">▶</span>';
    b.innerHTML = img + '<span><span class="t">' + esc(h.title) + '</span>'
      + (h.desc ? '<span class="d">' + esc(h.desc) + '</span>' : '') + '</span>';

  });

}
$("back-home").onclick = function(){ show("home"); };
$("restart").onclick = function(){ show("home"); };

/* ---- 読み込みと生成 ---- */
/* 出題が4問に満たないときは、埋めずに止めて理由を見せる。
   質の低い問題で数を合わせるより、作れなかったと言うほうがいい。 */
function tooFew(title){
  $("load-msg").innerHTML = '<span class="err">「' + esc(title) + '」の記事からは問題を4問も作れませんでした。'
    + '出演者や放送局が表にまとまっている作品だと出題できます。</span>';
  var back = document.createElement("button");
  back.className = "btn ghost"; back.textContent = "別の作品を選ぶ";
  back.onclick = function(){ show("hits"); };
  $("found").append(back);
}

function startQuiz(quiz){
  state.quiz = quiz; state.at = 0; state.answers = [];
  askQuestion();
}

function load(title){
  show("load");
  $("load-msg").textContent = "「" + title + "」の記事を読んでいます…";
  $("found").textContent = "";

  fetchArticle(title).then(function(a){
    var w = parseArticle(a.title, a.html);
    state.work = w;
    reportFound(w);
    return fetchAiQuestions(w).then(function(ai){
      w.aiQuestions = ai;
      var quiz = quizForWork(w, Date.now() & 0x7fffffff);
      if(quiz.length < 4) return tooFew(a.title);
      startQuiz(quiz);
    });
  }).catch(function(e){
    $("load-msg").innerHTML = '<span class="err">記事を読めませんでした（' + esc(e.message) + '）。</span>';
  });
}

/* AIは秘密鍵を持つWorker経由でだけ呼ぶ。Workerが未設定・失敗・時間切れでも
   従来の作り置き＋記事ベース出題へ戻り、ゲーム自体は止めない。 */
function fetchAiQuestions(w){
  var meta = document.querySelector('meta[name="drama-ai-endpoint"]');
  var endpoint = meta && meta.content.trim();
  if(!endpoint) return Promise.resolve([]);
  $("load-msg").textContent = "「" + w.title + "」の良問をAIが選んでいます…";
  var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 12000) : null;
  var payload = {
    title:w.title,
    prose:String(w.prose || "").slice(0, 14000),
    characters:(w.characters || []).slice(0, 60).map(function(c){
      return { role:c.role, actor:c.actor, desc:String(c.desc || "").slice(0, 180) };
    }),
    episodes:(w.episodes || []).slice(0, 30).map(function(e){
      return { no:e.no, subtitle:e.subtitle || "" };
    })
  };
  return fetch(endpoint, {
    method:"POST",
    headers:{ "content-type":"application/json" },
    body:JSON.stringify(payload),
    signal:ctrl ? ctrl.signal : undefined
  }).then(function(r){
    if(!r.ok) throw new Error("AI " + r.status);
    return r.json();
  }).then(function(j){
    return (j.questions || []).map(function(q){
      return [q.text, q.answer, q.wrongs, q.level, q.why];
    }).filter(function(q){
      return typeof q[0] === "string" && typeof q[1] === "string"
        && Array.isArray(q[2]) && q[2].length === 3
        && q[3] >= 1 && q[3] <= 3;
    }).slice(0, 10);
  }).catch(function(){ return []; }).then(function(qs){
    if(timer) clearTimeout(timer);
    return qs;
  });
}

/* 何が取れたかを見せる。取れなかった材料が分かると原因を追いやすい */
function reportFound(w){
  var prose = w.prose;
  var subs = w.episodes.filter(function(e){ return e.subtitle && e.subtitle.length >= 2; });
  var items = [
    ["文章" + (prose ? "：" + Math.round(prose.length / 100) / 10 + "千字" : ""), (prose || "").length >= 200],
    ["登場人物" + (w.characters.length ? "：" + w.characters.length + "人" : ""), w.characters.length >= 4],
    ["サブタイトル" + (subs.length ? "：" + subs.length + "話" : ""), subs.length >= 4],
    ["出演者" + (w.cast.length ? "：" + w.cast.length + "人" : ""), w.cast.length > 0],
    ["各話" + (w.episodes.length ? "：" + w.episodes.length + "話" : ""), w.episodes.length > 0],
    ["放送局" + (w.station ? "：" + w.station : ""), !!w.station],
    ["放送年" + (w.start ? "：" + w.start.y : ""), !!w.start],
    ["話数" + (w.count != null ? "：" + w.count : ""), w.count != null],
    ["視聴率", w.episodes.some(function(e){ return e.rating != null; })]
  ];
  var box = $("found"); box.textContent = "";
  items.forEach(function(p){
    var s = document.createElement("span");
    s.className = "tag" + (p[1] ? " has" : "");
    s.textContent = (p[1] ? "✓ " : "− ") + p[0];
    box.append(s);
  });
}

/* ---- 出題 ---- */
function askQuestion(){
  var q = state.quiz[state.at];
  state.locked = false;
  show("quiz");
  paintProgress();
  $("qcount").textContent = "第 " + (state.at + 1) + " 問 / " + state.quiz.length;
  var lv = $("qlv");
  lv.className = "lv l" + q.level;
  lv.textContent = LEVEL_NAME[q.level];
  $("qtext").textContent = q.text;
  var box = $("choices"); box.textContent = "";
  q.choices.forEach(function(c, i){
    var b = document.createElement("button");
    b.className = "ch";
    b.innerHTML = '<span class="mk">' + "ABCD"[i] + '</span>' + esc(c);
    b.onclick = function(){ answer(i); };
    box.append(b);
  });
  $("verdict").hidden = true;
  $("next").hidden = true;
}

function paintProgress(){
  var box = $("progress"); box.textContent = "";
  for(var i = 0; i < state.quiz.length; i++){
    var el = document.createElement("i");
    if(i < state.answers.length) el.className = state.answers[i] === state.quiz[i].answer ? "done" : "miss";
    else if(i === state.at) el.className = "now";
    box.append(el);
  }
}

function answer(chosen){
  if(state.locked) return;
  state.locked = true;
  var q = state.quiz[state.at];
  state.answers.push(chosen);
  var right = chosen === q.answer;
  var btns = $("choices").children;
  for(var i = 0; i < btns.length; i++){
    btns[i].disabled = true;
    if(i === q.answer) btns[i].classList.add("right");
    else if(i === chosen) btns[i].classList.add("wrong");
  }
  $("vmark").className = "v " + (right ? "o" : "x");
  $("vmark").textContent = right ? "正解" : "不正解";
  $("vnote").textContent = q.why;
  $("verdict").hidden = false;
  paintProgress();
  var last = state.at === state.quiz.length - 1;
  $("next").textContent = last ? "結果を見る" : "次の問題";
  $("next").hidden = false;
}

$("next").onclick = function(){
  if(state.at < state.quiz.length - 1){ state.at++; askQuestion(); }
  else finish();
};

/* ---- 結果 ---- */
function finish(){
  var g = grade(state.quiz, state.answers);
  var r = rankOf(g.ratio);
  $("rank").textContent = r.name;
  $("score").textContent = g.score;
  $("full").textContent = g.full;
  $("hits-n").textContent = g.hits;
  $("blurb").textContent = r.blurb;

  var names = LEVEL_NAME;
  var bars = $("bars"); bars.textContent = "";
  [1, 2, 3].forEach(function(lv){
    var p = g.per[lv];
    if(!p.full) return;
    var pct = Math.round(p.got / p.full * 100);
    var row = document.createElement("div");
    row.className = "bar";
    row.innerHTML = '<span class="nm">' + names[lv] + '</span>'
      + '<span class="tr"><span class="fl" style="width:' + pct + '%"></span></span>'
      + '<span class="vl">' + pct + '%</span>';
    bars.append(row);
  });

  var rv = $("review"); rv.textContent = "";
  state.quiz.forEach(function(q, i){
    var ok = state.answers[i] === q.answer;
    var d = document.createElement("div");
    d.className = "rv " + (ok ? "o" : "x");
    d.innerHTML = '<span class="a">' + (ok ? "○" : "×") + '</span> '
      + '<span class="q">' + esc(q.text) + '</span><br>' + esc(q.why);
    rv.append(d);
  });

  $("src").innerHTML = '出典：<a href="' + esc(state.work.url) + '" target="_blank" rel="noopener">'
    + esc(state.work.title) + ' - Wikipedia</a>（CC BY-SA）';
  show("done");
}

$("again").onclick = function(){
  /* 記事は取り直さない。材料は state.work に残っているので、種だけ変える */
  startQuiz(quizForWork(state.work, Date.now() & 0x7fffffff));
