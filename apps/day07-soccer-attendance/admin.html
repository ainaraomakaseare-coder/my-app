<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 接続先。Supabase の Settings → Data API の Project URL と、
     Settings → API Keys の Publishable key（sb_publishable_… で始まる方）を入れます。
     publishable キーは公開してよいキーです。守っているのはキーの秘密ではなく、
     データベース側の RLS です（README の「キーが公開されて平気な理由」を参照）。
     Secret key（sb_secret_… ）は絶対にここへ書かないでください。 -->
<meta name="soccer-supabase-url" content="https://cgerblghsuaqdqtymfki.supabase.co">
<meta name="soccer-supabase-key" content="">
<title>出欠管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#F4F6F4; --card:#FFFFFF; --ink:#16211B; --ink-2:#5A6B61; --ink-3:#8B9A91;
  --line:#DFE5E0; --pitch:#1E7A46; --pitch-lit:#259455; --pitch-soft:#E4F2EA;
  --absent:#C2453B; --absent-soft:#FBE9E7; --warn:#8A6410; --warn-soft:#FBF1DA;
  --shadow:0 1px 2px rgba(22,33,27,.06), 0 6px 16px rgba(22,33,27,.05);
  --font:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101613; --card:#18211C; --ink:#E9EFEA; --ink-2:#A3B3A9; --ink-3:#75857B;
    --line:#26332B; --pitch:#3FA96B; --pitch-lit:#4CBE7C; --pitch-soft:#17301F;
    --absent:#E4695C; --absent-soft:#331916; --warn:#D8B45C; --warn-soft:#2C2312;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.65;
  -webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%}
:focus-visible{outline:3px solid var(--pitch-lit);outline-offset:2px;border-radius:6px}
[hidden]{display:none !important}

.wrap{max-width:680px;margin:0 auto;padding:16px 14px 60px}

.head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-bottom:12px;border-bottom:1px solid var(--line)}
.title{font-size:19px;font-weight:900;margin:0}
.title span{font-size:12px;font-weight:700;color:var(--pitch);background:var(--pitch-soft);
  border-radius:5px;padding:2px 7px;margin-left:8px;vertical-align:2px;letter-spacing:.06em}

.tabs{display:flex;gap:6px;margin:14px 0 18px}
.tabs button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink-2);
  border-radius:10px;padding:10px 4px;font-size:14px;font-weight:700;letter-spacing:.04em}
.tabs button[aria-selected="true"]{background:var(--pitch);border-color:var(--pitch);color:#fff}

.sect{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.12em;margin:24px 2px 9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
  margin-bottom:11px;box-shadow:var(--shadow)}

.grid{display:grid;gap:9px}
.grid.two{grid-template-columns:1fr 1fr}
label.f{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:4px;letter-spacing:.05em}

.btn{border:none;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:700;
  background:var(--pitch);color:#fff;letter-spacing:.05em}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink-2)}
.btn.danger{background:var(--card);border:1px solid var(--absent);color:var(--absent)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* 予定 */
.when{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.date{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.date .dow{font-size:13px;margin-left:1px}
.date.sat .dow{color:#2F7BC4}
.date.sun .dow{color:var(--absent)}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:999px}
.badge.match{background:var(--pitch);color:#fff}
.badge.practice{background:var(--pitch-soft);color:var(--pitch)}
.meta{font-size:13px;color:var(--ink-2);margin:4px 0 0}
.tally{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;margin-top:8px}
.tally b{font-size:18px;font-weight:900;color:var(--ink)}
.tally .yes b{color:var(--pitch)}
.nore{background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:9px 11px;
  font-size:13px;margin-top:9px;line-height:1.7}
.nore b{font-weight:700}

/* 代理入力の表 */
.proxy{margin-top:11px;border-top:1px dashed var(--line);padding-top:10px}
.prow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:none}
.pname{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname i{font-style:normal;font-size:11.5px;color:var(--pitch);background:var(--pitch-soft);
  border-radius:4px;padding:1px 5px;margin-right:6px}
.pset{display:flex;gap:5px;flex:0 0 auto}
.pset button{border:1px solid var(--line);background:var(--card);color:var(--ink-3);
  border-radius:7px;padding:5px 11px;font-size:13px;font-weight:700}
.pset button[aria-pressed="true"].yes{background:var(--pitch);border-color:var(--pitch);color:#fff}
.pset button[aria-pressed="true"].no{background:var(--absent);border-color:var(--absent);color:#fff}

/* メンバー */
.mrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mrow:last-child{border-bottom:none}
.mrow.off{opacity:.5}
.mrow .no{width:64px;flex:0 0 auto}
.mrow .nm{flex:1;min-width:120px}

/* リンク */
.link{font-size:12px;color:var(--ink-3);word-break:break-all;background:var(--bg);
  border-radius:7px;padding:7px 9px;margin-top:5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

.msg{padding:16px;border-radius:12px;font-size:14px;line-height:1.75}
.msg.error{background:var(--absent-soft);color:var(--absent)}
.msg.info{background:var(--card);border:1px solid var(--line);color:var(--ink-2)}
.msg code{background:rgba(127,127,127,.14);padding:1px 5px;border-radius:4px;font-size:12.5px}
.empty{text-align:center;color:var(--ink-3);font-size:14px;padding:24px 10px}
.hint{font-size:12.5px;color:var(--ink-3);margin:6px 2px 0;line-height:1.7}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);background:var(--ink);
  color:var(--bg);font-size:13.5px;font-weight:700;padding:10px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--absent);color:#fff}
</style>
</head>
<body>

<div class="wrap">
  <div id="app" aria-live="polite"><p class="empty">読み込んでいます…</p></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="./js/db.js"></script>
<script>
(function () {
  const app = document.getElementById('app');
  const toastEl = document.getElementById('toast');

  let admin = null;
  let data = null;
  let tab = 'events';
  let openEvent = null;
  let busy = false;

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const DOW = ['日','月','火','水','木','金','土'];
  function fmtDate(iso) {
    const [y, m, d] = String(iso).split('-').map(Number);
    const dow = new Date(y, m - 1, d).getDay();
    return { text: m + '/' + d, dow: DOW[dow], cls: dow === 0 ? 'sun' : dow === 6 ? 'sat' : '' };
  }
  const fmtTime = (t) => (t ? String(t).slice(0, 5) : '');
  const todayISO = () => {
    const n = new Date();
    return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' +
           String(n.getDate()).padStart(2, '0');
  };

  let toastTimer = null;
  function toast(text, bad) {
    toastEl.textContent = text;
    toastEl.className = 'toast show' + (bad ? ' bad' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.className = 'toast'; }, bad ? 4500 : 1700);
  }

  // 個人リンクの土台。公開先が決まったらここを書き換えて使う。
  const BASE_KEY = 'day07.linkBase';
  function linkBase() {
    return localStorage.getItem(BASE_KEY) ||
           location.href.replace(/admin\.html.*$/, '').replace(/#.*$/, '');
  }
  const memberLink = (token) => linkBase().replace(/\/?$/, '/') + '#' + token;

  async function call(fn, args) {
    if (busy) return null;
    busy = true;
    document.querySelectorAll('button').forEach((b) => { b.disabled = true; });
    try {
      data = await DB.rpc(fn, Object.assign({ p_admin: admin }, args || {}));
      render();
      return data;
    } catch (e) {
      toast(e.message, true);
      document.querySelectorAll('button').forEach((b) => { b.disabled = false; });
      return null;
    } finally {
      busy = false;
    }
  }

  // ================= 予定タブ =================
  function eventsTab() {
    let h = '';

    h += '<div class="sect">予定を追加</div>';
    h += '<div class="card"><div class="grid">';
    h += '<div class="grid two">';
    h += '<div><label class="f" for="f-date">日付</label><input type="date" id="f-date" value="' + todayISO() + '"></div>';
    h += '<div><label class="f" for="f-time">開始時刻</label><input type="time" id="f-time"></div>';
    h += '</div>';
    h += '<div class="grid two">';
    h += '<div><label class="f" for="f-kind">種別</label><select id="f-kind">' +
         '<option value="practice">練習</option><option value="match">試合</option></select></div>';
    h += '<div><label class="f" for="f-place">場所</label><input id="f-place" placeholder="河川敷グラウンド"></div>';
    h += '</div>';
    h += '<div><label class="f" for="f-note">メモ</label><input id="f-note" placeholder="対戦相手・持ち物など"></div>';
    h += '<div><button class="btn" data-act="add-event">この予定を追加</button></div>';
    h += '</div></div>';

    const events = data.events || [];
    h += '<div class="sect">予定と出欠</div>';
    if (!events.length) {
      h += '<p class="empty">まだ予定がありません。</p>';
      return h;
    }

    const actives = (data.members || []).filter((m) => m.active);
    for (const ev of events) {
      const d = fmtDate(ev.date);
      const yes = ev.yes_count || 0, no = ev.no_count || 0;
      const answers = ev.answers || {};
      const noReply = actives.filter((m) => !answers[m.id]);

      h += '<div class="card">';
      h += '<div class="when">';
      h += '<span class="date ' + d.cls + '">' + d.text + '<span class="dow">(' + d.dow + ')</span></span>';
      h += '<span class="badge ' + ev.kind + '">' + (ev.kind === 'match' ? '試合' : '練習') + '</span>';
      if (ev.start_time) h += '<span class="meta" style="margin:0">' + esc(fmtTime(ev.start_time)) + '</span>';
      h += '</div>';
      if (ev.place || ev.note) {
        h += '<p class="meta">' + esc([ev.place, ev.note].filter(Boolean).join('　/　')) + '</p>';
      }

      h += '<div class="tally">';
      h += '<span class="yes">出席 <b>' + yes + '</b></span>';
      h += '<span>欠席 <b>' + no + '</b></span>';
      h += '<span>未回答 <b>' + noReply.length + '</b></span>';
      h += '</div>';

      if (noReply.length) {
        h += '<div class="nore"><b>未回答（' + noReply.length + '人）:</b> ' +
             noReply.map((m) => esc(m.name)).join('、') + '</div>';
      }

      h += '<div class="row" style="margin-top:10px">';
      h += '<button class="btn ghost sm" data-act="proxy" data-ev="' + ev.id + '">' +
           (openEvent === ev.id ? '閉じる' : '代理入力・修正') + '</button>';
      h += '<button class="btn danger sm" data-act="del-event" data-ev="' + ev.id + '">削除</button>';
      h += '</div>';

      if (openEvent === ev.id) {
        h += '<div class="proxy">';
        for (const m of actives) {
          const st = answers[m.id] || null;
          h += '<div class="prow"><span class="pname">' +
               (m.number ? '<i>' + esc(m.number) + '</i>' : '') + esc(m.name) + '</span>';
          h += '<span class="pset">';
          h += '<button class="yes" aria-pressed="' + (st === 'yes') + '" data-act="pset" data-ev="' +
               ev.id + '" data-m="' + m.id + '" data-v="yes">出席</button>';
          h += '<button class="no" aria-pressed="' + (st === 'no') + '" data-act="pset" data-ev="' +
               ev.id + '" data-m="' + m.id + '" data-v="no">欠席</button>';
          h += '</span></div>';
        }
        h += '<p class="hint">同じボタンをもう一度押すと未回答に戻ります。</p>';
        h += '</div>';
      }

      h += '</div>';
    }
    return h;
  }

  // ================= メンバータブ =================
  function membersTab() {
    let h = '';
    h += '<div class="sect">名簿をまとめて登録</div>';
    h += '<div class="card">';
    h += '<label class="f" for="f-bulk">名前を1行に1人ずつ（スプレッドシートの列をそのまま貼れます）</label>';
    h += '<textarea id="f-bulk" rows="6" placeholder="山田 太郎&#10;佐藤 次郎&#10;鈴木 三郎"></textarea>';
    h += '<p class="hint">すでに同じ名前がいる人は飛ばします。背番号はあとから付けられます。</p>';
    h += '<div style="margin-top:10px"><button class="btn" data-act="add-members">まとめて登録</button></div>';
    h += '</div>';

    const members = data.members || [];
    h += '<div class="sect">メンバー（' + members.filter((m) => m.active).length + '人）</div>';
    if (!members.length) {
      h += '<p class="empty">まだ登録されていません。</p>';
      return h;
    }

    h += '<div class="card">';
    for (const m of members) {
      h += '<div class="mrow' + (m.active ? '' : ' off') + '">';
      h += '<input class="no" value="' + esc(m.number || '') + '" placeholder="番号" data-fld="number" data-m="' + m.id + '">';
      h += '<input class="nm" value="' + esc(m.name) + '" data-fld="name" data-m="' + m.id + '">';
      h += '<button class="btn ghost sm" data-act="save-member" data-m="' + m.id + '">保存</button>';
      h += '<button class="btn ghost sm" data-act="toggle-member" data-m="' + m.id + '" data-v="' +
           (m.active ? 'off' : 'on') + '">' + (m.active ? '休会' : '復帰') + '</button>';
      h += '</div>';
    }
    h += '</div>';
    h += '<p class="hint">休会にすると出欠の集計から外れます。過去の記録は残ります。</p>';
    return h;
  }

  // ================= リンクタブ =================
  function linksTab() {
    let h = '';
    h += '<div class="sect">リンクの土台</div>';
    h += '<div class="card">';
    h += '<label class="f" for="f-base">公開先のURL</label>';
    h += '<input id="f-base" value="' + esc(linkBase()) + '" placeholder="https://example.com/">';
    h += '<p class="hint">インターネットに公開したら、その住所をここに入れてください。' +
         '下の個人リンクがその住所で作られるようになります。（この設定はこの端末にだけ残ります）</p>';
    h += '<div style="margin-top:10px"><button class="btn ghost" data-act="save-base">保存</button></div>';
    h += '</div>';

    const actives = (data.members || []).filter((m) => m.active);
    h += '<div class="sect">LINEに貼る文面</div>';
    h += '<div class="card">';
    h += '<p class="hint" style="margin-top:0">全員分をまとめてコピーして、チームのLINEに貼ってください。' +
         '各自が自分の名前のリンクをタップすると出欠を登録できます。</p>';
    h += '<div style="margin-top:10px"><button class="btn" data-act="copy-all">全員分をコピー</button></div>';
    h += '</div>';

    h += '<div class="sect">個人リンク（' + actives.length + '人）</div>';
    if (!actives.length) {
      h += '<p class="empty">メンバーを登録するとここにリンクが出ます。</p>';
      return h;
    }
    for (const m of actives) {
      h += '<div class="card">';
      h += '<div class="row"><b style="flex:1">' + esc(m.name) + '</b>';
      h += '<button class="btn ghost sm" data-act="copy-one" data-t="' + esc(m.token) + '">コピー</button>';
      h += '<button class="btn danger sm" data-act="reissue" data-m="' + m.id + '">作り直す</button></div>';
      h += '<div class="link">' + esc(memberLink(m.token)) + '</div>';
      h += '</div>';
    }
    h += '<p class="hint">リンクが外に漏れたときは「作り直す」を押してください。古いリンクはその場で使えなくなります。</p>';
    return h;
  }

  function render() {
    let h = '';
    h += '<div class="head"><h1 class="title">' + esc(data.team) + '<span>管理</span></h1>';
    h += '<button class="btn ghost sm" data-act="rename">名前変更</button></div>';

    h += '<div class="tabs" role="tablist">';
    for (const [key, label] of [['events','予定'],['members','メンバー'],['links','リンク配布']]) {
      h += '<button role="tab" aria-selected="' + (tab === key) + '" data-act="tab" data-t="' + key + '">' +
           label + '</button>';
    }
    h += '</div>';

    h += tab === 'events' ? eventsTab() : tab === 'members' ? membersTab() : linksTab();
    app.innerHTML = h;
  }

  async function copyText(text, okMsg) {
    try {
      await navigator.clipboard.writeText(text);
      toast(okMsg);
    } catch (e) {
      // クリップボードが使えない環境（古いブラウザ・http以外）向けの逃げ道
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand && document.execCommand('copy');
      document.body.removeChild(ta);
      toast(ok ? okMsg : 'コピーできませんでした。長押しで選んでください。', !ok);
    }
  }

  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;

    if (act === 'tab') { tab = btn.dataset.t; openEvent = null; render(); return; }

    if (act === 'add-event') {
      const date = document.getElementById('f-date').value;
      if (!date) { toast('日付を選んでください', true); return; }
      await call('admin_save_event', {
        p_event_id: null,
        p_date: date,
        p_time: document.getElementById('f-time').value || null,
        p_kind: document.getElementById('f-kind').value,
        p_place: document.getElementById('f-place').value,
        p_note: document.getElementById('f-note').value,
      });
      toast('予定を追加しました');
      return;
    }

    if (act === 'del-event') {
      if (!confirm('この予定を削除します。出欠の回答も一緒に消えます。よろしいですか？')) return;
      await call('admin_delete_event', { p_event_id: btn.dataset.ev });
      toast('削除しました');
      return;
    }

    if (act === 'proxy') {
      openEvent = openEvent === btn.dataset.ev ? null : btn.dataset.ev;
      render();
      return;
    }

    if (act === 'pset') {
      const ev = (data.events || []).find((x) => x.id === btn.dataset.ev);
      const now = ev && ev.answers ? ev.answers[btn.dataset.m] : null;
      const next = now === btn.dataset.v ? null : btn.dataset.v;
      await call('admin_set_status', {
        p_event_id: btn.dataset.ev, p_member_id: btn.dataset.m, p_status: next,
      });
      return;
    }

    if (act === 'add-members') {
      const box = document.getElementById('f-bulk');
      const names = box.value.split('\n').map((s) => s.trim()).filter(Boolean);
      if (!names.length) { toast('名前を入力してください', true); return; }
      const res = await call('admin_add_members', { p_names: names });
      if (res) { box.value = ''; toast(res.added + '人を登録しました'); }
      return;
    }

    if (act === 'save-member') {
      const id = btn.dataset.m;
      const nm = document.querySelector('input[data-fld="name"][data-m="' + id + '"]').value;
      const no = document.querySelector('input[data-fld="number"][data-m="' + id + '"]').value;
      await call('admin_update_member', { p_member_id: id, p_name: nm, p_number: no, p_active: null });
      toast('保存しました');
      return;
    }

    if (act === 'toggle-member') {
      await call('admin_update_member', {
        p_member_id: btn.dataset.m, p_name: null, p_number: null,
        p_active: btn.dataset.v === 'on',
      });
      return;
    }

    if (act === 'reissue') {
      if (!confirm('この人のリンクを作り直します。今までのリンクは使えなくなります。よろしいですか？')) return;
      await call('admin_reissue_token', { p_member_id: btn.dataset.m });
      toast('作り直しました。新しいリンクを渡してください');
      return;
    }

    if (act === 'rename') {
      const name = prompt('チーム名', data.team);
      if (name === null) return;
      await call('admin_rename_team', { p_name: name });
      return;
    }

    if (act === 'save-base') {
      const v = document.getElementById('f-base').value.trim();
      if (v) localStorage.setItem(BASE_KEY, v); else localStorage.removeItem(BASE_KEY);
      render();
      toast('保存しました');
      return;
    }

    if (act === 'copy-one') {
      copyText(memberLink(btn.dataset.t), 'リンクをコピーしました');
      return;
    }

    if (act === 'copy-all') {
      const actives = (data.members || []).filter((m) => m.active);
      if (!actives.length) { toast('メンバーがいません', true); return; }
      const body = ['【出欠の登録おねがいします】', '自分の名前のリンクから登録してください。', '']
        .concat(actives.map((m) => m.name + '\n' + memberLink(m.token)))
        .join('\n');
      copyText(body, '全員分をコピーしました');
      return;
    }
  });

  async function start() {
    if (!DB.ready()) {
      app.innerHTML = '<div class="msg info"><b>まだ接続先が設定されていません。</b><br>' +
        'admin.html の <code>soccer-supabase-key</code> の meta タグに、Supabase の ' +
        'Publishable key を入れてください。</div>';
      return;
    }
    admin = (location.hash || '').replace(/^#\/?a?\/?/, '').trim();
    if (!admin) {
      app.innerHTML = '<div class="msg info"><b>管理用トークンが必要です。</b><br>' +
        'Supabase で <code>db/schema.sql</code> を実行したときに表示された文字列を、' +
        'このページのURLの末尾に <code>#</code> を付けて貼ってください。</div>';
      return;
    }
    try {
      data = await DB.rpc('admin_home', { p_admin: admin });
      render();
    } catch (e) {
      app.innerHTML = '<div class="msg error"><b>開けませんでした。</b><br>' + esc(e.message) + '</div>';
    }
  }

  window.addEventListener('hashchange', () => location.reload());
  start();
})();
</script>
</body>
</html>
