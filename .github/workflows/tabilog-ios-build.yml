name: 旅の足跡 iOS ビルド & TestFlightアップロード

# 手動実行のみ（勝手に走って審査提出用のビルドが増えないように）。
# GitHubリポジトリの「Actions」タブ → このワークフロー名 → 「Run workflow」から実行する。
on:
  workflow_dispatch: {}

jobs:
  build:
    # iOSアプリのビルドにはXcodeが必要なため、macOSランナーを使う
    # （パブリックリポジトリなら無料枠で使えることが多い）。
    runs-on: macos-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Capacitorの依存パッケージをインストール
        working-directory: apps/day07-tabilog-ios
        run: npm install

      - name: iOSプロジェクトを生成（毎回作り直す。ネイティブのios/フォルダはリポジトリに入れない）
        working-directory: apps/day07-tabilog-ios
        run: npx cap add ios

      - name: マイク利用の説明文をInfo.plistに追加する
        # 「音声でまとめて記録する」機能がマイクを使うが、iOSはInfo.plistに
        # NSMicrophoneUsageDescription（利用目的の説明文）が無いとマイクへの
        # アクセスを許可しない。ios/フォルダは毎回作り直しなので、CI側で毎回追加する。
        working-directory: apps/day07-tabilog-ios/ios/App/App
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string '音声で旅の記録をまとめて追加するために使用します'" Info.plist

      - name: バージョン番号を設定
        # ios/フォルダは毎回作り直しなので、ビルド番号を前回の実行から引き継げない。
        # このワークフローの実行回数（github.run_number）を使えば、実行するたびに
        # 必ず増えていく値になり、「同じビルド番号は再アップロードできない」という
        # Apple側の制約を確実に満たせる。マーケティングバージョンはpackage.jsonの値を使う。
        working-directory: apps/day07-tabilog-ios/ios/App
        run: |
          MARKETING_VERSION=$(node -p "require('../../package.json').version")
          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all ${{ github.run_number }}

      - name: Web側の最新の中身をiOSプロジェクトへ反映
        working-directory: apps/day07-tabilog-ios
        run: npx cap sync ios

      - name: 配布用証明書をキーチェーンにインストールする
        # CIの実行環境は毎回使い捨てのMacのため、-allowProvisioningUpdatesだけに
        # 任せると、既存の証明書を再利用できず実行のたびに新しい証明書が作られてしまい
        # Apple側の証明書数の上限にすぐ達してしまっていた。1回だけ作った配布用証明書
        # （秘密鍵とセットでsecretsに保存）を、毎回一時キーチェーンにインストールして
        # 使い回すことで、証明書が際限なく増えるのを防ぐ。
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          # secretsに貼り付ける際に紛れ込みがちな改行・前後の空白を取り除いてから使う
          P12_PASSWORD=$(printf '%s' "$P12_PASSWORD" | tr -d '\n\r' | xargs)
          echo "$P12_BASE64" | tr -d '\n\r ' | base64 --decode > distribution.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import distribution.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed 's/"//g')
          rm distribution.p12

      - name: 配布用の証明書を使うようプロジェクトファイルを書き換える
        # Xcode/Capacitorが生成するプロジェクトは、Release構成にも既定で
        # CODE_SIGN_IDENTITY = "Apple Development" が焼き込まれている
        # （App本体だけでなく、CocoaPodsが生成するPods.xcodeproj内の各ターゲットも同じ）。
        # xcodebuildのコマンドライン引数でCODE_SIGN_IDENTITYを上書きしようとすると、
        # 「CODE_SIGN_STYLE=Automaticと競合している」というエラーになるため、
        # コマンドラインではなくプロジェクトファイル自体を書き換えて解決する。
        working-directory: apps/day07-tabilog-ios/ios
        run: |
          find . -name "project.pbxproj" -exec sed -i '' \
            's/CODE_SIGN_IDENTITY = "Apple Development"/CODE_SIGN_IDENTITY = "Apple Distribution"/g' {} \;

      - name: アイコン・スプラッシュ画像を生成する（resources/icon.png・splash.pngから）
        working-directory: apps/day07-tabilog-ios
        run: npx capacitor-assets generate --ios

      - name: App Store ConnectのAPIキーをファイルに書き出す
        working-directory: apps/day07-tabilog-ios
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPSTORE_CONNECT_API_PRIVATE_KEY }}" > ~/private_keys/AuthKey_${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}.p8

      - name: ExportOptions.plistを作る
        working-directory: apps/day07-tabilog-ios
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: アーカイブをビルド（自動署名。App Store Connect APIキーで認証）
        # -destinationを省略すると、CIランナーに実機が繋がっていないため
        # 「実機テスト用のプロビジョニングプロファイルを作ろうとして、対象の実機が無く失敗する」
        # ことがある（配布用アーカイブにテスト用プロファイルは本来不要）。
        # generic/platform=iOSを明示し、配布用のアーカイブとして扱わせる。
        # CODE_SIGN_IDENTITYはコマンドラインでは渡さない（CODE_SIGN_STYLE=Automaticと
        # 競合するエラーになるため）。配布用証明書への切り替えは、直前のステップで
        # プロジェクトファイル自体を書き換える形で行っている。
        working-directory: apps/day07-tabilog-ios/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -archivePath ../../build/App.xcarchive archive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}

      - name: .ipaを書き出す
        working-directory: apps/day07-tabilog-ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}

      - name: TestFlightへアップロード
        working-directory: apps/day07-tabilog-ios
        run: |
          xcrun altool --upload-app \
            -f build/export/*.ipa \
            -t ios \
            --apiKey ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }} \
            --apiIssuer ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}

      - name: ビルド成果物を保存（失敗時の確認用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabilog-ios-build
          path: |
            apps/day07-tabilog-ios/build
          retention-days: 5
