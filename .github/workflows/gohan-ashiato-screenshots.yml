name: ごはんの足跡 App Store 掲載内容を入れる
# App Store Connect の提出前の 1.0（却下後も含む、日本語）に、apps/gohan-ashiato-ios/store-listing.json の
# 説明文・プロモーション用テキスト・キーワードと、スクリーンショット（6.1/6.3インチ）を入れ、一番新しいビルドを選ぶ。
# mainに入ると自動で動く。同じ内容なら何も変えない。「審査へ提出」はしない。
on:
  push:
    branches: [main]
    paths: ["apps/gohan-ashiato-ios/store-screenshots/*.png", "apps/gohan-ashiato-ios/store-listing.json", "apps/gohan-ashiato-ios/scripts/update-store-listing.mjs", ".github/workflows/gohan-ashiato-screenshots.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: 'apply＝入れる / check＝確認だけ'
        type: choice
        options: [apply, check]
        default: apply
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/gohan-ashiato-ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 掲載内容を入れる
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_API_PRIVATE_KEY }}
          MODE: ${{ inputs.mode || 'apply' }}
        run: node scripts/update-store-listing.mjs "$MODE"
