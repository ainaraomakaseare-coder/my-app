name: ベイ日記 iOS ビルド & TestFlightアップロード

# 手動実行のみ（勝手に走って審査提出用のビルドが増えないように）。
# GitHubリポジトリの「Actions」タブ → このワークフロー名 → 「Run workflow」から実行する。
on:
  workflow_dispatch: {}

jobs:
  build:
    # iOSアプリのビルドにはXcodeが必要なため、macOSランナーを使う
    # （パブリックリポジトリなら無料枠で使えることが多い）。
    runs-on: macos-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Capacitorの依存パッケージをインストール
        working-directory: apps/day23-baydiary-ios
        run: npm install

      - name: iOSプロジェクトを生成（毎回作り直す。ネイティブのios/フォルダはリポジトリに入れない）
        working-directory: apps/day23-baydiary-ios
        run: npx cap add ios

      - name: CocoaPodsのライブラリターゲットで署名を要求しないようにする
        # Pods-App・Capacitor・CapacitorCordovaなどのライブラリターゲットは、
        # アプリ本体に組み込まれて一緒に署名されるため、本来プロビジョニング
        # プロファイルを必要としない。CODE_SIGN_STYLE=Manualを指定すると
        # これらのターゲットも巻き込まれ「does not support provisioning
        # profiles」というエラーになるため、Podfileのpost_installフックで
        # ライブラリターゲットだけ署名を求めないようにする（pod installが走る
        # 直前・Podfile生成直後に行う必要がある）。旅の足跡のiOS化（DAY26）で
        # 踏んだつまずきをそのまま踏襲している。
        working-directory: apps/day23-baydiary-ios/ios/App
        run: |
          python3 - << 'PYEOF'
          with open("Podfile") as f:
              content = f.read()
          marker = "post_install do |installer|\n"
          injected = (
              "  installer.pods_project.targets.each do |target|\n"
              "    target.build_configurations.each do |config|\n"
              "      config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'\n"
              "      config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'\n"
              "    end\n"
              "  end\n"
          )
          if marker in content:
              content = content.replace(marker, marker + injected, 1)
          else:
              content += "\n" + marker + injected + "end\n"
          with open("Podfile", "w") as f:
              f.write(content)
          PYEOF

      - name: 写真添付・輸出コンプライアンスの申告をInfo.plistに追加する
        # 「写真を添付する」でファイル選択から「写真を撮る」を選ぶとカメラを使うが、
        # iOSはInfo.plistにNSCameraUsageDescription（利用目的の説明文）が無いと
        # 許可を求める前に即座にアプリがクラッシュする（旅の足跡のiOS化＝DAY26で
        # 踏んだつまずきと同じ）。ios/フォルダは毎回作り直しなので、CI側で毎回追加する。
        working-directory: apps/day23-baydiary-ios/ios/App/App
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string '観戦した試合の写真をその場で撮って記録に添付するために使用します'" Info.plist
          # 独自の暗号化は使っておらず標準的なHTTPS通信のみのため、輸出コンプライアンスの
          # 質問（TestFlight配信のたびに毎回聞かれるやつ）が出ないようここで申告しておく。
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" Info.plist

      - name: バージョン番号を設定
        # ios/フォルダは毎回作り直しなので、ビルド番号を前回の実行から引き継げない。
        # このワークフローの実行回数（github.run_number）を使えば、実行するたびに
        # 必ず増えていく値になり、「同じビルド番号は再アップロードできない」という
        # Apple側の制約を確実に満たせる。マーケティングバージョンはpackage.jsonの値を使う。
        working-directory: apps/day23-baydiary-ios/ios/App
        run: |
          MARKETING_VERSION=$(node -p "require('../../package.json').version")
          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all ${{ github.run_number }}

      - name: Web側の最新の中身をiOSプロジェクトへ反映
        working-directory: apps/day23-baydiary-ios
        run: npx cap sync ios

      - name: 配布用証明書をキーチェーンにインストールする
        # 旅の足跡（day07-tabilog-ios）で1回だけ作った配布用証明書（Apple Developer
        # アカウント単位のもので、Bundle IDごとに作り直す必要はない）を、そのまま
        # 使い回す。CIの実行環境は毎回使い捨てのMacのため、毎回一時キーチェーンに
        # インストールし直す。
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          P12_PASSWORD=$(printf '%s' "$P12_PASSWORD" | tr -d '\n\r' | xargs)
          echo "$P12_BASE64" | tr -d '\n\r ' | base64 --decode > distribution.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import distribution.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed 's/"//g')
          rm distribution.p12

      - name: プロビジョニングプロファイルをインストールする
        # プロビジョニングプロファイルはBundle IDごとに別物が必要なため、
        # 旅の足跡（com.hiroyaapps.tabilog用）のものは使い回せない。
        # ベイ日記（com.hiroyaapps.baydiary）専用に新しく作った、別のシークレットを使う。
        env:
          PROFILE_BASE64: ${{ secrets.IOS_BAYDIARY_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | tr -d '\n\r ' | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/baydiary-appstore.mobileprovision

      - name: アイコン・スプラッシュ画像を生成する（resources/icon.png・splash.pngから）
        working-directory: apps/day23-baydiary-ios
        run: npx capacitor-assets generate --ios

      - name: App Store ConnectのAPIキーをファイルに書き出す
        # このAPIキーもApple Developerアカウント単位（App Manager権限）のため、
        # 旅の足跡と同じものをそのまま使い回せる。
        working-directory: apps/day23-baydiary-ios
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPSTORE_CONNECT_API_PRIVATE_KEY }}" > ~/private_keys/AuthKey_${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}.p8

      - name: ExportOptions.plistを作る
        working-directory: apps/day23-baydiary-ios
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.hiroyaapps.baydiary</key>
              <string>baydiary-appstore</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: アーカイブをビルド（手動署名。1回だけ作った配布用証明書・プロファイルを使う）
        # -destinationを省略すると、CIランナーに実機が繋がっていないため
        # 「実機テスト用のプロビジョニングプロファイルを作ろうとして、対象の実機が無く失敗する」
        # ことがある（配布用アーカイブにテスト用プロファイルは本来不要）。
        # generic/platform=iOSを明示し、配布用のアーカイブとして扱わせる。
        working-directory: apps/day23-baydiary-ios/ios/App
        run: |
          # IPHONEOS_DEPLOYMENT_TARGET: Capacitorのデフォルト(13.0)のままだと、
          # 2027年春以降アップロードできなくなる(Appleが15.0以上を必須化)との警告が
          # 毎回届くため、ここで15.0に引き上げる。コマンドラインで渡すとApp・Podsの
          # 両ターゲットに反映される。
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -archivePath ../../build/App.xcarchive archive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER=baydiary-appstore \
            IPHONEOS_DEPLOYMENT_TARGET=15.0

      - name: .ipaを書き出す
        working-directory: apps/day23-baydiary-ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}

      - name: TestFlightへアップロード
        working-directory: apps/day23-baydiary-ios
        run: |
          xcrun altool --upload-app \
            -f build/export/*.ipa \
            -t ios \
            --apiKey ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }} \
            --apiIssuer ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}

      - name: ビルド成果物を保存（失敗時の確認用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baydiary-ios-build
          path: |
            apps/day23-baydiary-ios/build
          retention-days: 5
